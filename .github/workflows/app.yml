name: app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/openapi.yaml"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/openapi.yaml"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint Kotlin
        run: ./gradlew ktlintCheck --no-daemon

      - name: Test shared module
        run: ./gradlew :shared:test --no-daemon

      - name: Compile desktop
        run: ./gradlew :desktop:compileKotlin --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: app/shared/build/reports/tests/
