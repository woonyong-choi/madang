<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>표</title>
<style>
  :root { --color-accent: #3a5bd9; --color-text: #1d2330; --color-muted: #6b7280; --color-stripe: #f6f7fb; --font-size: 14px;
          --font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif; }
  body { margin: 0; padding: 28px; background: #fff; color: var(--color-text); font: var(--font-size)/1.5 var(--font-family); }
  h1 { margin: 0 0 14px; font-size: 1.35em; }
  table { width: 100%; border-collapse: collapse; }
  caption { caption-side: bottom; padding-top: 10px; text-align: left; color: var(--color-muted); font-size: .88em; }
  th { text-align: left; padding: 9px 12px; border-bottom: 2px solid var(--color-accent); color: var(--color-accent); font-weight: 700; white-space: nowrap; }
  td { padding: 8px 12px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  tbody tr:nth-child(even) { background: var(--color-stripe); }
</style>
</head>
<body>
<main data-madang-root>
  <h1 data-if="data.title" data-bind="data.title"></h1>
  <table>
    <caption data-if="data.caption" data-bind="data.caption"></caption>
    <thead>
      <tr><th data-each="data.columns" data-bind="."></th></tr>
    </thead>
    <tbody>
      <tr data-each="data.rows"><td data-each="." data-bind="."></td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
