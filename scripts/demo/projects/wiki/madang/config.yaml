# 정원 위키 설정. 앱(core)이 읽는다. 에이전트는 이 파일을 받지 않는다.

# .madang/을 git에 넣지 않는다(이 폴더는 git 저장소가 아니다).
track: false

# 게시: notes/의 문서를 site/ 폴더에 정적 사이트로 만든다.
publish:
  include: [notes]
  target: folder:site

# 정책: 문서가 바뀌면 자동으로 게시한다.
policy:
  auto_publish: true

# 실행 대상: 게시된 site/를 로컬 웹 서버로 연다.
runs:
  - name: 위키 사이트
    command: python3 -m http.server 8710
    cwd: site
    opens: http://localhost:8710
