# Madang 전역 설정. 앱(core)이 읽는다. 에이전트는 이 파일을 받지 않는다.
# 기억(나에 대한 메모)은 profile.md에 둔다.

# core API가 대기하는 주소
core:
  port: 7470
  bind: 127.0.0.1

# 에이전트 도구 자체 설정 파일의 경로
agents:
  claude_settings: ~/.claude/settings.json
  codex_config: ~/.codex/config.toml

# 페이지와 실행의 크기·시간 제한
limits:
  ledger_tokens: 2000
  block_input_tokens: 4000
  run_timeout_minutes: {design: 30, build: 20, small: 5, review: 10, explore: 5}

ui:
  language: ko

# madang project add가 관리한다. 항목: id, path, title, parent, icon, color, sort
projects: []

# 라우팅 표: 요청 종류를 고르는 규칙과 종류별 러너·모델 단계
# kinds는 요청을 나누는 작업 종류로 판정기와 tiers가 쓴다.
# page_kinds는 페이지가 무엇인지(문서·코드·대화)와 그 페이지의 기본 작업 종류다.
# 접두·키워드 규칙이 맞지 않으면 페이지 kind의 기본 작업 종류를, 그것도 없으면
# default_kind를 쓴다. 페이지 머리부의 kind에는 작업 종류와 페이지 종류를 다 쓸 수 있다.
routes:
  kinds: [design, build, small, review, explore]
  page_kinds: {doc: build, code: build, chat: explore}
  default_kind: build
  prefix_override: true          # "design: …" 접두가 종류를 강제한다
  rules:                          # 키워드 규칙 (첫 번째 판정기)
    design: [설계, 아키텍처, 원인, 왜, 구조]
    review: [리뷰, 검토, 점검]
    small:  [오타, 이름, 한 줄, 문구]
    explore: [어디, 찾아, 설명해, 뭐야]
  tiers:
    design:  [{runner: claude, model: claude-opus-5-5, effort: high},
              {runner: claude, model: claude-fable-5-1, effort: high}]
    build:   [{runner: codex,  model: gpt-6-sol, effort: medium},
              {runner: claude, model: claude-opus-5-5, effort: medium},
              {runner: claude, model: claude-fable-5-1, effort: high}]
    small:   [{runner: codex,  model: gpt-6-luna, effort: high},
              {runner: codex,  model: gpt-6-sol, effort: medium}]
    review:  [{runner: opposite, model: primary}]   # 구현한 쪽의 반대편
    explore: [{runner: codex,  model: gpt-6-luna, effort: medium},
              {runner: claude, model: claude-sonnet-5, effort: medium}]
  limits:
    max_runs_per_message: 6       # 승격과 리뷰 포함
    blocked_after_failures: 2     # 같은 검증의 연속 실패 횟수
  decider:
    chain: [rules, light_model]
    min_confidence: 0.7
  # 대체표: 러너가 로그인되지 않았거나 설치되지 않았을 때, 또는 조기 실패했을 때
  # 대신 쓸 러너/모델. 추론 강도는 그대로다. 대체는 run.fallback 이벤트와
  # 실행 기록(runs/N.json의 fallback)에 남는다. 이 키가 없으면 아래 기본값을 쓴다.
  fallbacks:
    codex/gpt-6-astra: claude/claude-fable-5-1
    codex/gpt-6-sol: claude/claude-opus-5-5
    codex/gpt-6-luna: claude/claude-sonnet-5
    claude/claude-fable-5-1: codex/gpt-6-astra
    claude/claude-opus-5-5: codex/gpt-6-sol
    claude/claude-sonnet-5: codex/gpt-6-sol
    claude/claude-haiku-4-5: codex/gpt-6-luna
  # 조기 실패: 실행이 within_seconds 안에 오류로 끝나고 오류 문구에 패턴이
  # 들어 있으면(대소문자 무시) 대체표의 러너로 한 번 다시 실행한다. 승격으로
  # 세지 않는다.
  early_failure:
    within_seconds: 90
    patterns: [not logged in, unauthorized, authentication, model not found,
               not available, invalid model, usage limit, rate limit, quota]

# 도구 경로와 실행 방법. system_est는 러너 자체 시스템 프롬프트와 도구의
# 추정 토큰 수로, 기본 인자로 한 단어를 실행했을 때 측정한 입력량을 올림한 값이다.
# args 자리표시자: {model} {effort} {home} {cwd} {page} {records}(프로젝트 .madang 폴더).
# claude 기본 인자는 사용자 ~/.claude 설정과 상관없이 비대화형으로 돌도록 권한을 준다.
#   --permission-mode acceptEdits  파일 수정은 묻지 않고 허용한다
#   --add-dir {records}            코드 페이지는 워크트리에서 돌므로 작업 폴더 밖 페이지 폴더에도 쓴다
#   --allowedTools                 madang 명령(커밋·푸시·결정·할 일 기록)을 허용한다
#   --disallowedTools              git·gh를 직접 실행하지 않는다. git은 core만 실행하고
#                                  게시는 madang을 거친다. push --force 같은 정책 금지 명령도
#                                  여기에 들어가며, 프로젝트 policy.deny는 실행마다 core가 더한다
# 값을 여러 개 받는 옵션 뒤에는 다른 옵션이 와야 한다(프롬프트는 core가 -- 뒤에 붙인다).
runners:
  claude:
    bin: claude
    args: ["-p", "--output-format", "stream-json", "--verbose",
           "--permission-mode", "acceptEdits",
           "--add-dir", "{records}",
           "--allowedTools", "Bash(madang *)",
           "--disallowedTools", "Bash(git *)", "Bash(gh *)",
           "--model", "{model}", "--effort", "{effort}"]
    auth: subscription            # subscription | api
    cache_ttl: 1h
    system_est: 23000
  codex:
    bin: codex
    # --skip-git-repo-check  git 저장소가 아닌 프로젝트(위키·문서 폴더)에서도 돈다
    args: ["exec", "--json", "--skip-git-repo-check",
           "-m", "{model}", "-c", "model_reasoning_effort={effort}"]
    auth: subscription
    system_est: 24000
