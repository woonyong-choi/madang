# system_est: 러너 자체 시스템 프롬프트와 도구의 추정 토큰 수.
# 기본 인자로 한 단어를 실행했을 때 측정한 입력량을 올림한 값이다.
claude:
  bin: claude
  args: ["-p", "--output-format", "stream-json", "--verbose", "--model", "{model}", "--effort", "{effort}"]
  auth: subscription            # subscription | api
  cache_ttl: 1h
  system_est: 23000
codex:
  bin: codex
  args: ["exec", "--json", "-m", "{model}", "-c", "model_reasoning_effort={effort}"]
  auth: subscription
  system_est: 24000
