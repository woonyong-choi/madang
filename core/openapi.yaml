    # 템플릿

    TemplateSlot:
      type: object
      required: [name, required]
      properties:
        name:
          type: string
        schema:
          type: string
          description: "schema.json 안의 포인터. 예: `#/base`."
        required:
          type: boolean
        label:
          type: string
      examples:
        - {name: base, schema: "#/base", required: true, label: 기본 데이터}

    TemplateEditable:
      type: object
      properties:
        text:
          type: boolean
        style:
          type: array
          items:
            type: string
      examples:
        - text: true
          style: [color.accent, font.size]

    Template:
      type: object
      required: [name, version, title, slots, builtin]
      properties:
        name:
          type: string
        version:
          type: integer
        title:
          type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/TemplateSlot"
        editable:
          $ref: "#/components/schemas/TemplateEditable"
        builtin:
          type: boolean
          description: 설치한 것이 아니라 앱에 포함된 템플릿.
      examples:
        - name: resume
          version: 1
          title: 이력서
          slots:
            - {name: base, schema: "#/base", required: true, label: 기본 데이터}
            - {name: overlay, schema: "#/overlay", required: false, label: 덮어쓰기}
          editable: {text: true, style: [color.accent, font.size]}
          builtin: true

    TemplateSchema:
      type: object
      required: [name, version, schema]
      properties:
        name:
          type: string
        version:
          type: integer
        schema:
          type: string
          description: JSON 텍스트로 된 schema.json 문서.
      examples:
        - name: resume
          version: 1
          schema: '{"$schema": "https://json-schema.org/draft/2020-12/schema", "base": {"type": "object", "required": ["name", "work"]}, "overlay": {"type": "object"}}'

    # 이벤트

    Event:
      description: |
        WebSocket 메시지 하나. 모든 이벤트는 봉투
        `{type, ts, project?, page?, block?, run?, data}`를 가지며 `data`는
        `type`에 따라 달라진다.
      oneOf:
        - $ref: "#/components/schemas/ProjectCreatedEvent"
        - $ref: "#/components/schemas/ProjectUpdatedEvent"
        - $ref: "#/components/schemas/ProjectDeletedEvent"
        - $ref: "#/components/schemas/PageCreatedEvent"
        - $ref: "#/components/schemas/PageUpdatedEvent"
        - $ref: "#/components/schemas/PageDeletedEvent"
        - $ref: "#/components/schemas/BlockAddedEvent"
        - $ref: "#/components/schemas/BlockUpdatedEvent"
        - $ref: "#/components/schemas/BlockDeletedEvent"
        - $ref: "#/components/schemas/RunStartedEvent"
        - $ref: "#/components/schemas/RunAssembledEvent"
        - $ref: "#/components/schemas/RunProgressEvent"
        - $ref: "#/components/schemas/RunFinishedEvent"
        - $ref: "#/components/schemas/RunFailedEvent"
        - $ref: "#/components/schemas/RunFallbackEvent"
        - $ref: "#/components/schemas/PageUnknownFilesEvent"
        - $ref: "#/components/schemas/FlowWaitingEvent"
        - $ref: "#/components/schemas/MemoryUpdatedEvent"
        - $ref: "#/components/schemas/RunnerAvailabilityEvent"
        - $ref: "#/components/schemas/AskCreatedEvent"
        - $ref: "#/components/schemas/RunLogEvent"
        - $ref: "#/components/schemas/RunsOpenedEvent"
        - $ref: "#/components/schemas/PortsChangedEvent"
        - $ref: "#/components/schemas/GitChangedEvent"
        - $ref: "#/components/schemas/PublishDoneEvent"
        - $ref: "#/components/schemas/ViewerChangedEvent"
      discriminator:
        propertyName: type
        mapping:
          project.created: "#/components/schemas/ProjectCreatedEvent"
          project.updated: "#/components/schemas/ProjectUpdatedEvent"
          project.deleted: "#/components/schemas/ProjectDeletedEvent"
          page.created: "#/components/schemas/PageCreatedEvent"
          page.updated: "#/components/schemas/PageUpdatedEvent"
          page.deleted: "#/components/schemas/PageDeletedEvent"
          block.added: "#/components/schemas/BlockAddedEvent"
          block.updated: "#/components/schemas/BlockUpdatedEvent"
          block.deleted: "#/components/schemas/BlockDeletedEvent"
          run.started: "#/components/schemas/RunStartedEvent"
          run.assembled: "#/components/schemas/RunAssembledEvent"
          run.progress: "#/components/schemas/RunProgressEvent"
          run.finished: "#/components/schemas/RunFinishedEvent"
          run.failed: "#/components/schemas/RunFailedEvent"
          run.fallback: "#/components/schemas/RunFallbackEvent"
          page.unknown_files: "#/components/schemas/PageUnknownFilesEvent"
          flow.waiting: "#/components/schemas/FlowWaitingEvent"
          memory.updated: "#/components/schemas/MemoryUpdatedEvent"
          runner.availability: "#/components/schemas/RunnerAvailabilityEvent"
          ask.created: "#/components/schemas/AskCreatedEvent"
          run.log: "#/components/schemas/RunLogEvent"
          runs.opened: "#/components/schemas/RunsOpenedEvent"
          ports.changed: "#/components/schemas/PortsChangedEvent"
          git.changed: "#/components/schemas/GitChangedEvent"
          publish.done: "#/components/schemas/PublishDoneEvent"
          viewer.changed: "#/components/schemas/ViewerChangedEvent"

    EventType:
      type: string
      enum:
        - project.created
        - project.updated
        - project.deleted
        - page.created
        - page.updated
        - page.deleted
        - block.added
        - block.updated
        - block.deleted
        - run.started
        - run.assembled
        - run.progress
        - run.finished
        - run.failed
        - run.fallback
        - page.unknown_files
        - flow.waiting
        - memory.updated
        - runner.availability
        - ask.created
        - run.log
        - runs.opened
        - ports.changed
        - git.changed
        - publish.done
        - viewer.changed

    EventEnvelope:
      type: object
      description: >-
        모든 이벤트가 공유하는 키. 이것을 먼저 해석하고 `type`으로 구체
        이벤트를 해석한다.
      required: [type, ts]
      properties:
        type:
          $ref: "#/components/schemas/EventType"
        ts:
          type: string
          format: date-time
        project:
          type: string
          description: 프로젝트 id.
        page:
          type: string
        block:
          type: string
        run:
          type: integer
      examples:
        - type: run.progress
          ts: "2026-09-24T09:31:12+09:00"
          project: jobs
          page: 2026-09-24-resume
          run: 2

    DeletedRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: 삭제(프로젝트는 등록 해제)된 대상의 프로젝트 id, 페이지 id, 블록 id.
      examples:
        - id: b06

    ProjectEventData:
      type: object
      required: [project]
      properties:
        project:
          $ref: "#/components/schemas/Project"

    PageEventData:
      type: object
      required: [page]
      properties:
        page:
          $ref: "#/components/schemas/PageCard"

    BlockEventData:
      type: object
      required: [block]
      properties:
        block:
          $ref: "#/components/schemas/BlockHeader"

    RunStartedData:
      type: object
      required: [runner, model, kind, tier]
      properties:
        runner:
          type: string
        model:
          type: string
        effort:
          type: string
        kind:
          type: string
        tier:
          type: integer
        trigger:
          $ref: "#/components/schemas/RunTrigger"

    RunFailedData:
      type: object
      required: [result_status, error]
      properties:
        result_status:
          $ref: "#/components/schemas/RunResultStatus"
        error:
          type: string

    RunFallbackData:
      type: object
      description: runner와 model은 `runner/model` 형식. effort는 유지된다.
      required: [from, to, reason]
      properties:
        from:
          type: string
        to:
          type: string
        reason:
          type: string
          description: "`unavailable`, 또는 일치한 초기 실패."
      examples:
        - from: codex/gpt-6-luna
          to: claude/claude-sonnet-5
          reason: unavailable

    UnknownFilesData:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/UnknownFile"

    FlowWaitingData:
      type: object
      description: >-
        답해야 할 사람 결정(`decision`), 또는 flow가 진행할 수 없는 이유.
        예: 쓸 수 있는 runner가 없으면 `no_runner`.
      properties:
        decision:
          $ref: "#/components/schemas/PendingDecision"
        reason:
          type: string
      examples:
        - decision:
            id: q1
            run: 2
            question:
              kind: choice
              prompt: ledger.md 보정에 실패했습니다. 어떻게 할까요?
              options: [retry, next_tier, stop]
        - reason: no_runner

    MemoryUpdatedData:
      type: object
      required: [layer]
      properties:
        layer:
          $ref: "#/components/schemas/MemoryLayer"
        tokens:
          type: integer

    AskCreatedData:
      type: object
      description: 정책이 부작용을 멈춘 자리에 생긴 묻는 블록.
      required: [block, decision, prompt, reasons, options]
      properties:
        block:
          type: string
          description: page.md 묻는 블록 id. `POST /pages/{page}/asks/{id}/answer`의 id.
        decision:
          type: string
          description: 같은 질문의 결정 id(`flow.waiting`의 `decision.id`).
        prompt:
          type: string
        reasons:
          type: array
          description: 정책이 거부한 이유.
          items:
            type: string
        options:
          type: array
          items:
            type: string

    RunLogData:
      type: object
      description: 실행 대상 프로세스 출력 한 줄. 끝나면 `exit_code`가 있는 빈 줄이 온다.
      required: [name, line]
      properties:
        name:
          type: string
          description: 실행 대상 이름.
        line:
          type: string
        exit_code:
          type: integer
          description: 프로세스가 끝났을 때만 있다.

    RunsOpenedData:
      type: object
      description: "`opens` URL이 응답했다. 앱은 이 URL을 브라우저 탭으로 연다."
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string

    PortsChangedData:
      type: object
      description: 실행 대상이 열리거나 끝난 뒤 프로젝트의 지금 열린 포트.
      required: [name, ports]
      properties:
        name:
          type: string
          description: 변화를 일으킨 실행 대상.
        ports:
          type: array
          items:
            $ref: "#/components/schemas/ObservedPort"

    GitChangedData:
      type: object
      description: core가 git 작업 트리나 브랜치를 바꿨다. 앱은 git 탭을 다시 가져온다.
      required: [folder, action]
      properties:
        folder:
          type: string
          description: 바뀐 작업 트리.
        action:
          type: string
          enum: [stage, commit, push, pull, init, merge, undo, publish]
        commit:
          type: string
        branch:
          type: string
        head:
          type: string

    PublishDoneData:
      type: object
      required: [n, undo]
      properties:
        n:
          type: integer
          description: 게시 번호.
        undo:
          type: boolean
          description: 되감기였으면 참.
        push_error:
          type: string
          description: 게시 브랜치를 밀다 실패한 이유.

    ViewerChangedData:
      type: object
      description: 뷰어를 등록했거나 live 뷰어의 정본이 바뀌었다. 그 뷰어를 쓰는 문서를 다시 그린다.
