        - branch: main
          remote: origin

    # 파일과 휴지통

    UnknownFile:
      type: object
      description: run이 만들었지만 등록하지 않은 파일.
      required: [path]
      properties:
        path:
          type: string
          description: 페이지 기준 경로, 코드 저장소면 `repo:` 접두어.
        run:
          type: [integer, "null"]
          description: 이 파일을 발견한 run.
      examples:
        - path: blocks/notes.txt
          run: 2

    UnknownFileAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [artifact, keep, delete]
      examples:
        - action: artifact

    TrashEntry:
      type: object
      required: [commit, deleted, page, paths, message]
      properties:
        commit:
          type: string
          description: 삭제한 커밋.
        deleted:
          type: string
          format: date-time
        space:
          type: string
        page:
          type: string
        block:
          type: [string, "null"]
          description: 페이지 전체가 삭제됐으면 null.
        paths:
          type: array
          description: 지워진 경로(앱 홈 기준).
          items:
            type: string
        message:
          type: string
          description: 커밋 메시지.
      examples:
        - commit: 9f8e7d6
          deleted: "2026-09-23T18:02:11+09:00"
          space: jobs
          page: 2026-09-20-cover-letter
          block: null
          paths: [spaces/jobs/pages/2026-09-20-cover-letter]
          message: "[2026-09-20-cover-letter] delete page"

    TrashRestore:
      type: object
      required: [commit, paths]
      properties:
        commit:
          type: string
          description: 복원 커밋.
        paths:
          type: array
          items:
            type: string
      examples:
        - commit: 0a1b2c3
          paths: [spaces/jobs/pages/2026-09-20-cover-letter]

    # 템플릿

    TemplateSlot:
      type: object
      required: [name, required]
      properties:
        name:
          type: string
        schema:
          type: string
          description: "schema.json 안의 포인터. 예: `#/base`."
        required:
          type: boolean
        label:
          type: string
      examples:
        - {name: base, schema: "#/base", required: true, label: 기본 데이터}

    TemplateEditable:
      type: object
      properties:
        text:
          type: boolean
        style:
          type: array
          items:
            type: string
      examples:
        - text: true
          style: [color.accent, font.size]

    Template:
      type: object
      required: [name, version, title, slots, builtin]
      properties:
        name:
          type: string
        version:
          type: integer
        title:
          type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/TemplateSlot"
        editable:
          $ref: "#/components/schemas/TemplateEditable"
        builtin:
          type: boolean
          description: 설치한 것이 아니라 앱에 포함된 템플릿.
      examples:
        - name: resume
          version: 1
          title: 이력서
          slots:
            - {name: base, schema: "#/base", required: true, label: 기본 데이터}
            - {name: overlay, schema: "#/overlay", required: false, label: 덮어쓰기}
          editable: {text: true, style: [color.accent, font.size]}
          builtin: true

    TemplateSchema:
      type: object
      required: [name, version, schema]
      properties:
        name:
          type: string
        version:
          type: integer
        schema:
          type: string
          description: JSON 텍스트로 된 schema.json 문서.
      examples:
        - name: resume
          version: 1
          schema: '{"$schema": "https://json-schema.org/draft/2020-12/schema", "base": {"type": "object", "required": ["name", "work"]}, "overlay": {"type": "object"}}'

    # 이벤트

    Event:
      description: |
        WebSocket 메시지 하나. 모든 이벤트는 봉투
        `{type, ts, space?, page?, block?, run?, data}`를 가지며 `data`는
        `type`에 따라 달라진다.
      oneOf:
        - $ref: "#/components/schemas/SpaceCreatedEvent"
        - $ref: "#/components/schemas/SpaceUpdatedEvent"
        - $ref: "#/components/schemas/SpaceDeletedEvent"
        - $ref: "#/components/schemas/PageCreatedEvent"
        - $ref: "#/components/schemas/PageUpdatedEvent"
        - $ref: "#/components/schemas/PageDeletedEvent"
        - $ref: "#/components/schemas/BlockAddedEvent"
        - $ref: "#/components/schemas/BlockUpdatedEvent"
        - $ref: "#/components/schemas/BlockDeletedEvent"
        - $ref: "#/components/schemas/RunStartedEvent"
        - $ref: "#/components/schemas/RunAssembledEvent"
        - $ref: "#/components/schemas/RunProgressEvent"
        - $ref: "#/components/schemas/RunFinishedEvent"
        - $ref: "#/components/schemas/RunFailedEvent"
        - $ref: "#/components/schemas/RunFallbackEvent"
        - $ref: "#/components/schemas/PageUnknownFilesEvent"
        - $ref: "#/components/schemas/FlowWaitingEvent"
        - $ref: "#/components/schemas/MemoryUpdatedEvent"
        - $ref: "#/components/schemas/RunnerAvailabilityEvent"
      discriminator:
        propertyName: type
        mapping:
          space.created: "#/components/schemas/SpaceCreatedEvent"
          space.updated: "#/components/schemas/SpaceUpdatedEvent"
          space.deleted: "#/components/schemas/SpaceDeletedEvent"
          page.created: "#/components/schemas/PageCreatedEvent"
          page.updated: "#/components/schemas/PageUpdatedEvent"
          page.deleted: "#/components/schemas/PageDeletedEvent"
          block.added: "#/components/schemas/BlockAddedEvent"
          block.updated: "#/components/schemas/BlockUpdatedEvent"
          block.deleted: "#/components/schemas/BlockDeletedEvent"
          run.started: "#/components/schemas/RunStartedEvent"
          run.assembled: "#/components/schemas/RunAssembledEvent"
          run.progress: "#/components/schemas/RunProgressEvent"
          run.finished: "#/components/schemas/RunFinishedEvent"
          run.failed: "#/components/schemas/RunFailedEvent"
          run.fallback: "#/components/schemas/RunFallbackEvent"
          page.unknown_files: "#/components/schemas/PageUnknownFilesEvent"
          flow.waiting: "#/components/schemas/FlowWaitingEvent"
          memory.updated: "#/components/schemas/MemoryUpdatedEvent"
          runner.availability: "#/components/schemas/RunnerAvailabilityEvent"

    EventType:
      type: string
      enum:
        - space.created
        - space.updated
        - space.deleted
        - page.created
        - page.updated
        - page.deleted
        - block.added
        - block.updated
        - block.deleted
        - run.started
        - run.assembled
        - run.progress
        - run.finished
        - run.failed
        - run.fallback
        - page.unknown_files
        - flow.waiting
        - memory.updated
        - runner.availability

    EventEnvelope:
      type: object
      description: >-
        모든 이벤트가 공유하는 키. 이것을 먼저 해석하고 `type`으로 구체
        이벤트를 해석한다.
      required: [type, ts]
      properties:
        type:
          $ref: "#/components/schemas/EventType"
        ts:
          type: string
          format: date-time
        space:
          type: string
        page:
          type: string
        block:
          type: string
        run:
          type: integer
      examples:
        - type: run.progress
          ts: "2026-09-24T09:31:12+09:00"
          space: jobs
          page: 2026-09-24-resume
          run: 2

    DeletedRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: 삭제된 대상의 slug, 페이지 id, 블록 id.
      examples:
        - id: b06

    SpaceEventData:
      type: object
      required: [space]
      properties:
        space:
          $ref: "#/components/schemas/Space"

    PageEventData:
      type: object
      required: [page]
      properties:
        page:
          $ref: "#/components/schemas/PageCard"

    BlockEventData:
      type: object
      required: [block]
      properties:
        block:
          $ref: "#/components/schemas/BlockHeader"

    RunStartedData:
      type: object
      required: [runner, model, kind, tier]
      properties:
        runner:
          type: string
        model:
          type: string
        effort:
          type: string
        kind:
          type: string
        tier:
          type: integer
        trigger:
          $ref: "#/components/schemas/RunTrigger"

    RunFailedData:
      type: object
      required: [result_status, error]
      properties:
        result_status:
          $ref: "#/components/schemas/RunResultStatus"
        error:
          type: string

    RunFallbackData:
      type: object
      description: runner와 model은 `runner/model` 형식. effort는 유지된다.
      required: [from, to, reason]
      properties:
        from:
          type: string
        to:
          type: string
        reason:
          type: string
          description: "`unavailable`, 또는 일치한 초기 실패."
      examples:
        - from: codex/gpt-6-luna
          to: claude/claude-sonnet-5
          reason: unavailable

    UnknownFilesData:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/UnknownFile"

    FlowWaitingData:
      type: object
      description: >-
        답해야 할 사람 결정(`decision`), 또는 flow가 진행할 수 없는 이유.
        예: 쓸 수 있는 runner가 없으면 `no_runner`.
      properties:
        decision:
          $ref: "#/components/schemas/PendingDecision"
        reason:
          type: string
      examples:
        - decision:
            id: q1
            run: 2
            question:
              kind: choice
              prompt: state.md 보정에 실패했습니다. 어떻게 할까요?
              options: [retry, next_tier, stop]
        - reason: no_runner

    MemoryUpdatedData:
      type: object
      required: [layer]
      properties:
        layer:
          $ref: "#/components/schemas/MemoryLayer"
        tokens:
          type: integer

    SpaceCreatedEvent:
      type: object
      required: [type, ts, space, data]
      properties:
        type: {type: string, enum: [space.created]}
        ts: {type: string, format: date-time}
        space: {type: string}
        data: {$ref: "#/components/schemas/SpaceEventData"}
      examples:
        - type: space.created
          ts: "2026-09-24T08:05:00+09:00"
          space: jobs
          data: {space: {slug: jobs, title: 지원, repo: null, pages: 0, active_pages: 0}}

    SpaceUpdatedEvent:
      type: object
      required: [type, ts, space, data]
      properties:
        type: {type: string, enum: [space.updated]}
        ts: {type: string, format: date-time}
        space: {type: string}
        data: {$ref: "#/components/schemas/SpaceEventData"}
      examples:
        - type: space.updated
          ts: "2026-09-24T08:06:00+09:00"
          space: jobs
          data: {space: {slug: jobs, title: 지원 2026, repo: null, pages: 1, active_pages: 0}}

    SpaceDeletedEvent:
      type: object
      required: [type, ts, space, data]
      properties:
        type: {type: string, enum: [space.deleted]}
        ts: {type: string, format: date-time}
        space: {type: string}
        data: {$ref: "#/components/schemas/DeletedRef"}
      examples:
        - type: space.deleted
          ts: "2026-09-24T10:00:00+09:00"
          space: old
          data: {id: old}

    PageCreatedEvent:
      type: object
      required: [type, ts, space, page, data]
      properties:
        type: {type: string, enum: [page.created]}
        ts: {type: string, format: date-time}
        space: {type: string}
        page: {type: string}
        data: {$ref: "#/components/schemas/PageEventData"}
      examples:
        - type: page.created
          ts: "2026-09-24T08:10:00+09:00"
          space: jobs
          page: 2026-09-24-resume
          data:
            page: {id: 2026-09-24-resume, space: jobs, title: 이력서, kind: build, status: planning, created: "2026-09-24T08:10:00+09:00", updated: "2026-09-24T08:10:00+09:00", pinned: false, tags: [], preview: null, block_counts: {}, first_view: null}

    PageUpdatedEvent:
      type: object
      required: [type, ts, space, page, data]
      properties:
        type: {type: string, enum: [page.updated]}
        ts: {type: string, format: date-time}
        space: {type: string}
        page: {type: string}
        data: {$ref: "#/components/schemas/PageEventData"}
      examples:
        - type: page.updated
          ts: "2026-09-24T09:31:41+09:00"
          space: jobs
          page: 2026-09-24-resume
          data:
            page:
              id: 2026-09-24-resume
              space: jobs
              title: 이력서
              kind: build
              status: review
              updated: "2026-09-24T09:31:41+09:00"
