openapi: 3.1.0
info:
  title: Madang core API
  version: 1.0.0
  summary: madang-core의 로컬 HTTP·WebSocket API.
  description: |
    데스크톱 앱은 이 API로 madang-core와 통신한다. 앱 홈(`~/.madang`)은
    core가 소유하며 앱은 자체 문서를 두지 않는다.

    규약:
    - 시각은 오프셋이 붙은 ISO 8601이다(`2026-09-24T09:40:00+09:00`).
    - 페이지 id는 `YYYY-MM-DD-<slug>`, 블록 id는 `bNN`이다. run 번호는
      페이지별로 늘어나며 재사용하지 않는다.
    - 페이지 안의 경로는 페이지 기준이다(`blocks/b05-base.json`). 공간의
      코드 저장소 경로에는 `repo:` 접두어가 붙는다
      (`repo:src/session/lock.ts`).
    - 오류는 `ApiError`로 돌려준다. 파일 검사에 실패하면 400과 함께
      `ValidationFailure`와 그 `issues`를 돌려준다.
    - 변경은 `/events` WebSocket으로 알린다. 앱은 재연결 후 전부 다시
      가져온다.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:7470
    description: 로컬 core. 포트는 다를 수 있으며 core가 core.port에 적는다.
tags:
  - name: system
  - name: setup
    description: 앱 홈 초기화와 설정 파일 편집.
  - name: spaces
  - name: pages
  - name: blocks
  - name: memory
  - name: messages
  - name: runs
  - name: decisions
  - name: files
  - name: trash
  - name: templates
  - name: runners
  - name: agent
    description: madang CLI가 하는 상태·저장소 변경.
  - name: events

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: core가 떠 있는지 알린다.
      responses:
        "200":
          description: core가 실행 중이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /runners:
    get:
      tags: [runners]
      operationId: listRunners
      summary: runner별 사용 가능 여부.
      description: |
        시작할 때와 매 run 전에 확인하고 5분간 캐시한다
        (`claude auth status`, `codex login status`, API runner는 키 유무).
        변경은 `runner.availability`로도 알린다.
      responses:
        "200":
          description: 최근 확인 결과.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerAvailability"

  /home:
    get:
      tags: [setup]
      operationId: getHome
      summary: core가 쓰는 앱 홈과 초기화 여부.
      description: |
        `initialized`가 거짓이면 앱은 온보딩을 보여 주고 `POST /home`으로
        앱 홈을 만든다. 초기화 전의 core는 빈 앱 홈처럼 답한다: 목록은
        비어 있고, 공간·페이지 경로는 404, 만들기와 설정은 409.
      responses:
        "200":
          description: 앱 홈 상태.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeStatus"
    post:
      tags: [setup]
      operationId: initHome
      summary: 앱 홈을 만들고(이미 있으면 그대로) core가 그 홈을 쓰게 한다.
      description: |
        `path`에 앱 홈을 초기화한다. 기존 파일은 덮어쓰지 않는다. `remote`는
        `config/madang.yaml`의 `home_remote`에 주소만 기록하며 원격 저장소를
        만들지는 않는다. core는 이후 이 홈을 쓰고 `core.port`도 이 홈에 둔다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeInit"
      responses:
        "200":
          description: 초기화된 앱 홈.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "409":
          $ref: "#/components/responses/Conflict"

  /config/routes:
    get:
      tags: [setup]
      operationId: getRoutes
      summary: config/routes.yaml 원문.
      responses:
        "200":
          description: 라우팅 표.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutesDocument"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      tags: [setup]
      operationId: saveRoutes
      summary: config/routes.yaml을 바꾼다. 검사를 통과해야 저장된다.
      description: |
        YAML 문법, 필수 키(`kinds`, `default_kind`, `tiers`), 스키마, 종류와
        runner 참조를 검사한다. 실패하면 파일은 그대로다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutesDocument"
      responses:
        "200":
          description: 저장된 라우팅 표.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutesDocument"
        "400":
          $ref: "#/components/responses/Invalid"
        "409":
          $ref: "#/components/responses/Conflict"

  /spaces:
    get:
      tags: [spaces]
      operationId: listSpaces
      summary: 공간 목록. 루트 공간은 항상 있다.
      responses:
        "200":
          description: 모든 공간.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Space"
    post:
      tags: [spaces]
      operationId: createSpace
      summary: 공간을 만든다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceCreate"
      responses:
        "201":
          description: 새 공간.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /spaces/{space}:
    parameters:
      - $ref: "#/components/parameters/Space"
    patch:
      tags: [spaces]
      operationId: updateSpace
      summary: 공간의 제목, 상위 공간, 아이콘, 색, 정렬을 바꾸거나 코드 저장소를 연결한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceUpdate"
      responses:
        "200":
          description: 수정된 공간.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [spaces]
      operationId: deleteSpace
      summary: 빈 공간을 지운다.
      responses:
        "204":
          description: 삭제하고 커밋했다.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /spaces/{space}/pages:
    parameters:
      - $ref: "#/components/parameters/Space"
    get:
      tags: [pages]
      operationId: listPages
      summary: 공간의 페이지를 카드로 나열한다.
      description: 고정된 페이지가 먼저, 그다음은 공간의 `sort` 기준(기본 `updated`, 최신순).
      responses:
        "200":
          description: 페이지 카드.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageCard"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [pages]
      operationId: createPage
      summary: page.md, state.md, log.md를 갖춘 페이지를 만든다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageCreate"
      responses:
        "201":
          description: 새 페이지.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDetail"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /spaces/{space}/repo/commit:
    parameters:
      - $ref: "#/components/parameters/Space"
    post:
      tags: [agent]
      operationId: commitRepo
      summary: 공간의 코드 저장소에 커밋한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoCommit"
      responses:
        "200":
          description: 새 커밋.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCommitResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /spaces/{space}/repo/push:
    parameters:
      - $ref: "#/components/parameters/Space"
    post:
      tags: [agent]
      operationId: pushRepo
      summary: 코드 저장소의 현재 브랜치를 push한다.
      description: force push는 하지 않으며 다른 브랜치도 push하지 않는다.
      responses:
        "200":
          description: push했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoPushResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}:
    parameters:
      - $ref: "#/components/parameters/Page"
    get:
      tags: [pages]
      operationId: getPage
      summary: page.md와 블록 머리부.
      responses:
        "200":
          description: 페이지.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [pages]
      operationId: updatePage
      summary: 제목, 고정, 태그, 블록 순서를 바꾸거나 페이지를 다른 공간으로 옮긴다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageUpdate"
      responses:
        "200":
          description: 수정된 카드.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCard"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [pages]
      operationId: deletePage
      summary: 페이지 폴더를 지우고 커밋한다. 휴지통에서 복원할 수 있다.
      responses:
        "204":
          description: 삭제하고 커밋했다.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/blocks:
    parameters:
      - $ref: "#/components/parameters/Page"
    post:
      tags: [blocks]
      operationId: createBlock
      summary: doc, data, view 블록을 만들어 페이지 끝에 붙인다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockCreate"
      responses:
        "201":
          description: 새 블록 머리부.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockHeader"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/blocks/{block}:
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Block"
    get:
      tags: [blocks]
      operationId: getBlock
      summary: 블록 파일 전체.
      responses:
        "200":
          description: 머리부와 파일 내용.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [blocks]
      operationId: replaceBlock
      summary: 블록 파일 전체를 바꾼다(앱에서 직접 편집).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockContent"
      responses:
        "200":
          description: 저장된 블록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [blocks]
      operationId: updateBlockHeader
      summary: 머리부 키만 바꾼다(bindings, presets, theme, title).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockHeaderPatch"
      responses:
        "200":
          description: 새 머리부.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockHeader"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [blocks]
      operationId: deleteBlock
      summary: "`git rm`으로 블록을 지우고 커밋한다."
      responses:
        "204":
          description: 삭제하고 커밋했다.
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/blocks/{block}/promote:
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Block"
    post:
      tags: [blocks]
      operationId: promoteBlock
      summary: 블록 파일을 코드 저장소의 docs/에 복사하고 커밋한다.
      responses:
        "200":
          description: 승격했거나 이미 최신이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoteResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/memory:
    parameters:
      - $ref: "#/components/parameters/Page"
    get:
      tags: [memory]
      operationId: getMemory
      summary: 에이전트가 매 호출마다 읽는 3층 memory.
      responses:
        "200":
          description: root.md, space.md, state.md.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/memory/{layer}:
    parameters:
      - $ref: "#/components/parameters/Page"
      - name: layer
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/MemoryLayer"
    put:
      tags: [memory]
      operationId: saveMemory
      summary: memory 파일 하나를 저장한다. 검사를 통과해야 저장된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryContent"
      responses:
        "200":
          description: 저장된 파일.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryFile"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/messages:
    parameters:
      - $ref: "#/components/parameters/Page"
    post:
      tags: [messages]
      operationId: sendMessage
      summary: 사용자 메시지를 추가하고 run을 시작한다.
      description: |
        run은 `run.*` 이벤트로 알린다. 선택한 요소를 겨냥한 요청
        (`mode: edit`과 `elements`)은 항상 종류 `small`로 실행한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "202":
          description: 메시지를 저장하고 flow를 시작했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAccepted"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/runs/{n}:
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/RunNumber"
    get:
      tags: [runs]
      operationId: getRun
      summary: run 기록(runs/N.json).
      responses:
        "200":
          description: 기록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/runs/{n}/cancel:
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/RunNumber"
    post:
      tags: [runs]
      operationId: cancelRun
      summary: 진행 중인 run을 멈춘다. `cancelled`로 끝난다.
      responses:
        "202":
          description: 멈추는 중. 이어서 `run.failed`가 온다.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/runs/{n}/events:
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/RunNumber"
    get:
      tags: [runs]
      operationId: listRunEvents
      summary: run의 이벤트 로그(runs/N.events.jsonl).
      description: |
        runner 이벤트를 도착 순서대로 돌려준다. 진행 중인 run이면 그때까지의
        이벤트다. 레이어 1의 run 패널이 읽는다.
      responses:
        "200":
          description: run의 이벤트.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunStreamEvent"
                examples:
                  - - type: text
                      text: work 배열에서 펄어비스 항목을 찾습니다.
                    - type: tool_call
                      name: apply_patch
                      summary: blocks/b05-base.json
                    - type: file_changed
                      path: blocks/b05-base.json
                    - type: usage
                      usage: {input: 29104, cached: 24310, output: 612}
                    - type: done
                      text: work 순서를 바꿨습니다. 펄어비스 경력이 맨 위입니다.
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/decisions/{id}/answer:
    parameters:
      - $ref: "#/components/parameters/Page"
      - name: id
        in: path
        required: true
        description: "`flow.waiting`으로 받은 대기 중 결정의 id."
        schema:
          type: string
    post:
      tags: [decisions]
      operationId: answerDecision
      summary: 사람 결정에 답해 기다리던 flow를 재개한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionAnswer"
      responses:
        "202":
          description: flow를 재개했다.
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/preview-input:
    parameters:
      - $ref: "#/components/parameters/Page"
    get:
      tags: [messages]
      operationId: previewInput
      summary: 다음 호출이 읽을 내용과 부분별 토큰 추정치.
      description: 앱은 사용자가 입력하는 동안 디바운스해서 호출한다.
      parameters:
        - name: target
          in: query
          required: false
          description: 대상 블록 id. 생략하면 페이지를 대상으로 한다.
          schema:
            type: string
          example: b04
        - name: elements
          in: query
          required: false
          description: 선택한 요소의 데이터 경로.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          example: ["work[1]"]
        - name: mode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TargetMode"
        - name: text
          in: query
          required: false
          description: 지금까지 입력한 요청 문장.
          schema:
            type: string
      responses:
        "200":
          description: 입력 내역.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InputPreview"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/unknown-files:
    parameters:
      - $ref: "#/components/parameters/Page"
    get:
      tags: [files]
      operationId: listUnknownFiles
      summary: run이 남겼지만 artifact로 등록되지 않은 파일.
      responses:
        "200":
          description: 미처리 파일.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnknownFile"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/unknown-files/{path}:
    parameters:
      - $ref: "#/components/parameters/Page"
      - name: path
        in: path
        required: true
        description: >-
          목록에 나온 파일 경로를 한 세그먼트로 퍼센트 인코딩한 값
          (`blocks%2Fnotes.txt`, `repo%3Asrc%2Fscratch.ts`).
        schema:
          type: string
    post:
      tags: [files]
      operationId: resolveUnknownFile
      summary: 알 수 없는 파일 하나를 등록·유지·삭제한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnknownFileAction"
      responses:
        "200":
          description: 아직 처리되지 않은 파일.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnknownFile"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/state/tasks:
    parameters:
      - $ref: "#/components/parameters/Page"
    patch:
      tags: [agent]
      operationId: setTask
      summary: state.md에 작업을 추가하거나 갱신한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: 저장된 작업.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/state/decisions:
    parameters:
      - $ref: "#/components/parameters/Page"
    post:
      tags: [agent]
      operationId: recordDecision
      summary: state.md에 결정을 기록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionCreate"
      responses:
        "201":
          description: 저장된 결정.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateDecision"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/state/artifacts:
    parameters:
      - $ref: "#/components/parameters/Page"
    post:
      tags: [agent]
      operationId: addArtifact
      summary: state.md의 artifacts에 파일을 등록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactAdd"
      responses:
        "200":
          description: 변경 후 전체 artifacts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                examples:
                  - - blocks/b04-resume.view.md
                    - blocks/b05-base.json
                    - blocks/b06-pearlabyss.json
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /trash:
    get:
      tags: [trash]
      operationId: listTrash
      summary: 최근 삭제된 페이지와 블록, 최신순.
      responses:
        "200":
          description: 앱 홈 이력에서 찾은 삭제 내역.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrashEntry"

  /trash/{commit}/restore:
    parameters:
      - name: commit
        in: path
        required: true
        description: 삭제한 커밋.
        schema:
          type: string
    post:
      tags: [trash]
      operationId: restoreTrash
      summary: 삭제 커밋이 지운 것을 되살리고 커밋한다.
      responses:
        "200":
          description: 복원했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashRestore"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: 내장·설치된 view 템플릿.
      responses:
        "200":
          description: 템플릿 목록.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /templates/{name}/schema:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        example: resume
    get:
      tags: [templates]
      operationId: getTemplateSchema
      summary: 템플릿의 slot 스키마(schema.json).
      responses:
        "200":
          description: 스키마 문서.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSchema"
        "404":
          $ref: "#/components/responses/NotFound"

  /events:
    x-websocket:
      protocol: websocket
      direction: server-to-client
      message: "#/components/schemas/Event"
    get:
      tags: [events]
      operationId: openEvents
      summary: 변경 이벤트 WebSocket 스트림.
      description: |
        WebSocket으로 업그레이드한다. 텍스트 프레임 하나가 JSON `Event`
        하나다(`components.schemas.Event` 참고, `type`으로 구분). 클라이언트는
        아무것도 보내지 않는다. 재연결 후 클라이언트는 공간, 페이지, 열려 있는
        페이지를 다시 가져온다.
      x-websocket: true
      responses:
        "101":
          description: WebSocket 프로토콜로 전환한다.

components:
  parameters:
    Space:
      name: space
      in: path
      required: true
      description: 공간 slug.
      schema:
        type: string
      example: jobs
    Page:
      name: page
      in: path
      required: true
      description: 페이지 id.
      schema:
        type: string
      example: 2026-09-24-resume
    Block:
      name: block
      in: path
      required: true
      description: 블록 id.
      schema:
        type: string
      example: b04
    RunNumber:
      name: n
      in: path
      required: true
      description: 페이지 안의 run 번호.
      schema:
        type: integer
        minimum: 1
      example: 2

  responses:
    Invalid:
      description: 요청 또는 결과 파일이 검사에 실패했다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationFailure"
    NotFound:
      description: 공간, 페이지, 블록, run, 파일이 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: not_found
            message: page '2026-09-30-missing' not found
    Conflict:
      description: 현재 상태에서는 변경할 수 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: conflict
            message: space 'jobs' still has 2 pages

  schemas:
    # 오류

    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: >-
            기계가 읽는 사유: `not_found`, `conflict`, `invalid`, `busy`,
            `no_repo`.
        message:
          type: string
      examples:
        - error: conflict
          message: a run is already in progress on this page

    Issue:
      type: object
      description: 검사 문제 하나.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            케밥 표기 식별자. 알려진 코드: `missing-file`,
            `unreadable`, `frontmatter`, `missing-key`, `invalid-value`,
            `duplicate-decision`, `choice-not-in-options`, `repo-unset`,
            `invalid-artifact`, `artifact-missing`, `missing-section`,
            `token-limit`, `done-without-verify`, `invalid-yaml`.
        message:
          type: string
        line:
          type: [integer, "null"]
          description: 1부터 세는 파일 줄. 알 때만.
        path:
          type: [string, "null"]
          description: 파일. 알 때만.
      examples:
        - code: missing-section
          message: "missing required section '## 다음 할 일'"
          line: null
          path: state.md

    ValidationFailure:
      type: object
      required: [error, message, issues]
      properties:
        error:
          type: string
          enum: [invalid]
        message:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
      examples:
        - error: invalid
          message: state.md failed validation
          issues:
            - code: invalid-value
              message: "status: expected planning | doing | blocked | review | done"
              line: 2
              path: state.md
            - code: token-limit
              message: state.md is 2310 tokens (limit 2000); summarize the log
              line: null
              path: state.md

    # 시스템

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: core 버전.
      examples:
        - status: ok
          version: 0.1.0

    # 설정

    HomeStatus:
      type: object
      description: core가 쓰는 앱 홈.
      required: [path, initialized]
      properties:
        path:
          type: string
          description: 앱 홈의 절대 경로.
        initialized:
          type: boolean
          description: 설정 파일이 있는 앱 홈인지. 거짓이면 온보딩이 필요하다.
        remote:
          type: [string, "null"]
          description: config/madang.yaml의 `home_remote`.
      examples:
        - path: /Users/me/.madang
          initialized: true
          remote: git@github.com:me/madang-home.git
        - path: /Users/me/.madang
          initialized: false
          remote: null

    HomeInit:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 앱 홈 경로. `~`는 사용자 홈으로 푼다.
        remote:
          type: [string, "null"]
          description: 기록할 git 원격 주소. 생략하면 기록하지 않는다.
      examples:
        - path: ~/.madang
          remote: git@github.com:me/madang-home.git
        - path: ~/Documents/madang

    RoutesDocument:
      type: object
      description: config/routes.yaml 원문.
      required: [text]
      properties:
        text:
          type: string
      examples:
        - text: |
            kinds: [design, build, small, review, explore]
            default_kind: build
            tiers:
              design: [{runner: claude, model: claude-opus-5-5, effort: high}]
              build: [{runner: codex, model: gpt-6-sol, effort: medium}]
              small: [{runner: codex, model: gpt-6-luna, effort: high}]
              review: [{runner: opposite, model: primary}]
              explore: [{runner: codex, model: gpt-6-luna, effort: medium}]

    # 러너

    RunnerStatus:
      type: object
      required: [name, available]
      properties:
        name:
          type: string
          description: runners.yaml의 runner 이름.
        available:
          type: boolean
        auth:
          type: string
          enum: [subscription, api]
        reason:
          type: [string, "null"]
          description: runner를 쓸 수 없는 이유.
      examples:
        - name: codex
          available: false
          auth: subscription
          reason: not logged in

    RunnerAvailability:
      type: object
      required: [checked, runners]
      properties:
        checked:
          type: string
          format: date-time
        runners:
          type: array
          items:
            $ref: "#/components/schemas/RunnerStatus"
      examples:
        - checked: "2026-09-24T09:30:12+09:00"
          runners:
            - name: claude
              available: true
              auth: subscription
              reason: null
            - name: codex
              available: true
              auth: subscription
              reason: null

    # 공간

    SpaceSort:
      type: string
      description: 고정된 페이지 다음에 공간의 페이지를 어떤 기준으로 정렬할지.
      enum: [updated, created, title]

    Space:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
        title:
          type: string
        repo:
          type: [string, "null"]
          description: space.md의 코드 저장소 경로.
        parent:
          type: [string, "null"]
          description: 상위 공간 slug. 최상위 공간이면 null.
        icon:
          type: [string, "null"]
          description: 공간 옆에 보여 줄 아이콘 이름.
        color:
          type: [string, "null"]
          description: 강조 색(`#rrggbb`).
          pattern: "^#[0-9a-fA-F]{6}$"
        sort:
          $ref: "#/components/schemas/SpaceSort"
        pages:
          type: integer
          description: 페이지 수.
        active_pages:
          type: integer
          description: 상태가 doing 또는 blocked인 페이지 수.
      examples:
        - slug: jobs
          title: 지원
          repo: null
          parent: null
          icon: briefcase
          color: "#3a5bd9"
          sort: updated
          pages: 2
          active_pages: 0
        - slug: jobs-2026
          title: 2026 하반기
          repo: null
          parent: jobs
          icon: null
          color: null
          sort: created
          pages: 0
          active_pages: 0

    SpaceCreate:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
        title:
          type: string
        repo:
          type: string
        parent:
          type: string
          description: 상위 공간 slug.
        icon:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        sort:
          $ref: "#/components/schemas/SpaceSort"
      examples:
        - slug: jobs
          title: 지원
        - slug: jobs-2026
          title: 2026 하반기
          parent: jobs
          icon: calendar
          color: "#b8322a"
          sort: created

    SpaceUpdate:
      type: object
      properties:
        title:
          type: string
        repo:
          type: [string, "null"]
          description: 경로를 주면 저장소를 연결하고 null이면 연결을 끊는다.
        parent:
          type: [string, "null"]
          description: slug를 주면 그 공간 아래로 옮기고 null이면 최상위로 옮긴다.
        icon:
          type: [string, "null"]
        color:
          type: [string, "null"]
          pattern: "^#[0-9a-fA-F]{6}$"
        sort:
          $ref: "#/components/schemas/SpaceSort"
      examples:
        - title: 지원 2026
        - parent: jobs
          icon: folder
          color: "#3a5bd9"
          sort: title

    # 페이지

    PageStatus:
      type: string
      enum: [planning, doing, blocked, review, done]

    RunRef:
      type: object
      description: 카드에 보여 줄 페이지의 마지막 run.
      required: [n, runner, model]
      properties:
        n:
          type: integer
        runner:
          type: string
        model:
          type: string
        result_status:
          $ref: "#/components/schemas/RunResultStatus"
      examples:
        - n: 2
          runner: codex
          model: gpt-6-luna
          result_status: review

    PageCard:
      type: object
      description: 페이지 목록의 카드 하나.
      required: [id, space, title, status, pinned, tags, block_counts]
      properties:
        id:
          type: string
        space:
          type: string
          description: 공간 slug.
        title:
          type: string
        kind:
          type: string
          description: 기본 요청 종류(router 힌트).
        status:
          $ref: "#/components/schemas/PageStatus"
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        pinned:
          type: boolean
        tags:
          type: array
          items:
            type: string
        preview:
          type: [string, "null"]
          description: 마지막 메시지 한 줄.
        block_counts:
          type: object
          description: 블록 종류별 개수. run은 `run`으로 센다.
          additionalProperties:
            type: integer
        last_run:
          $ref: "#/components/schemas/RunRef"
          description: 페이지에 run이 아직 없으면 없다.
        first_view:
          type: [string, "null"]
          description: 카드 썸네일용 첫 view 블록의 id.
      examples:
        - id: 2026-09-24-resume
          space: jobs
          title: 이력서
          kind: build
          status: review
          created: "2026-09-24T08:10:00+09:00"
          updated: "2026-09-24T09:31:41+09:00"
          pinned: true
          tags: [이력서]
          preview: work 순서를 바꿨습니다. 펄어비스 경력이 맨 위입니다.
          block_counts: {message: 9, view: 1, data: 2, run: 2}
          last_run: {n: 2, runner: codex, model: gpt-6-luna, result_status: review}
          first_view: b04

    PageCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        kind:
          type: string
          description: 기본값은 routes.yaml의 `default_kind`.
      examples:
        - title: 이력서
          kind: build

    PageUpdate:
      type: object
      properties:
        title:
          type: string
        pinned:
          type: boolean
        tags:
          type: array
          items:
            type: string
        blocks_order:
          type: array
          description: page.md `blocks`의 새 순서 전체.
          items:
            type: string
        space:
          type: string
          description: 페이지를 옮길 공간의 slug.
      examples:
        - pinned: true
          tags: [이력서]
        - space: archive

    PageDetail:
      type: object
      description: page.md, 본문 순서대로의 블록 머리부, run 목록.
      required: [id, space, title, status, pinned, tags, blocks, runs, unknown_files]
      properties:
        id:
          type: string
        space:
          type: string
        title:
          type: string
        kind:
          type: string
        status:
          $ref: "#/components/schemas/PageStatus"
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        pinned:
          type: boolean
        tags:
          type: array
          items:
            type: string
        overview:
          type: string
          description: page.md의 Markdown 본문.
        blocks:
          type: array
          description: page.md `blocks` 순서의 블록 머리부.
          items:
            $ref: "#/components/schemas/BlockHeader"
        runs:
          type: array
          description: >-
            run 요약, 오름차순. 각 run은 `trigger.message`의 메시지 뒤에
            보여 준다.
          items:
            $ref: "#/components/schemas/RunRecord"
        unknown_files:
          type: array
          description: 미처리 알 수 없는 파일. 비어 있지 않으면 배너를 보여 준다.
          items:
            $ref: "#/components/schemas/UnknownFile"
        waiting:
          $ref: "#/components/schemas/FlowWaitingData"
          description: >-
            flow가 사람 결정이나 runner를 기다리는 동안에만 있다.
      examples:
        - id: 2026-09-24-resume
          space: jobs
          title: 이력서
          kind: build
          status: review
          created: "2026-09-24T08:10:00+09:00"
          updated: "2026-09-24T09:31:41+09:00"
          pinned: true
          tags: [이력서]
          overview: ""
          blocks:
            - {id: b01, type: message, role: user, ts: "2026-09-24T08:11:02+09:00", text: 이력서 템플릿 만들어줘, target: {}}
            - {id: b02, type: message, role: router, ts: "2026-09-24T08:11:03+09:00", run: 1, text: "kind=design conf=0.91 → claude/claude-opus-5-5 high"}
            - {id: b03, type: message, role: agent, ts: "2026-09-24T08:14:40+09:00", run: 1, text: "이력서 뷰(b04)와 기본 데이터(b05), 펄어비스용 덮어쓰기(b06)를 만들었습니다."}
            - id: b04
              type: view
              file: blocks/b04-resume.view.md
              title: 이력서
              created_by: run 1
              template: resume@1
              bindings: {base: b05, overlay: b06}
              presets:
                기본: {base: b05}
                펄어비스: {base: b05, overlay: b06}
              active_preset: 펄어비스
              theme: {color.accent: "#3a5bd9"}
            - {id: b05, type: data, file: blocks/b05-base.json, title: 기본 데이터, created_by: run 1, format: json}
            - {id: b06, type: data, file: blocks/b06-pearlabyss.json, title: 펄어비스 덮어쓰기, created_by: run 1, format: json}
            - {id: b07, type: message, role: user, ts: "2026-09-24T09:30:58+09:00", text: 펄어비스 경력을 맨 위로, target: {block: b04, elements: ["work[1]"], mode: edit}}
            - {id: b08, type: message, role: router, ts: "2026-09-24T09:31:00+09:00", run: 2, text: "kind=small conf=1.00 → codex/gpt-6-luna high"}
            - {id: b09, type: message, role: agent, ts: "2026-09-24T09:31:41+09:00", run: 2, text: work 순서를 바꿨습니다. 펄어비스 경력이 맨 위입니다.}
          runs:
            - n: 1
              started: "2026-09-24T08:11:03+09:00"
              finished: "2026-09-24T08:14:40+09:00"
              trigger: {message: b01}
              kind: design
              tier: 1
              runner: claude
