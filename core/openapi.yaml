    BlockDeletedEvent:
      type: object
      required: [type, ts, space, page, block, data]
      properties:
        type: {type: string, enum: [block.deleted]}
        ts: {type: string, format: date-time}
        space: {type: string}
        page: {type: string}
        block: {type: string}
        data: {$ref: "#/components/schemas/DeletedRef"}
      examples:
        - type: block.deleted
          ts: "2026-09-24T09:40:00+09:00"
          space: jobs
          page: 2026-09-24-resume
          block: b06
          data: {id: b06}

    RunStartedEvent:
      type: object
