          unknown_files: []

    # 블록

    BlockType:
      type: string
      enum: [message, doc, data, view, code, term, site, run]

    MessageRole:
      type: string
      enum: [user, router, agent]

    TargetMode:
      type: string
      enum: [view, edit]

    Target:
      type: object
      description: 메시지가 향하는 대상. 비어 있으면 페이지.
      properties:
        block:
          type: string
        elements:
          type: array
          description: "요소 데이터 경로. 예: `work[1].company`."
          items:
            type: string
        mode:
          $ref: "#/components/schemas/TargetMode"
      examples:
        - block: b04
          elements: ["work[1]"]
          mode: edit

    BlockHeader:
      type: object
      description: |
        블록 머리부. 공통 키가 먼저 나오고 나머지는 한 종류에만 속한다:
        message(`role`, `ts`, `run`, `target`, `text`), data(`format`,
        `schema`), view(`template`, `bindings`, `presets`, `active_preset`,
        `theme`), code(`path`, `since_run`), term(`cmd`, `cwd`, `proc`),
        site(`url`, `repo_bound`).
      required: [id, type]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/BlockType"
        file:
          type: [string, "null"]
          description: 페이지 기준 파일. 메시지는 page.md 본문에 있어 null.
        title:
          type: string
        created_by:
          type: string
          description: "`run N` 또는 `user`."
        role:
          $ref: "#/components/schemas/MessageRole"
        ts:
          type: string
          format: date-time
        run:
          type: integer
          description: 메시지를 쓴 run, 또는 메시지가 일으킨 run.
        target:
          $ref: "#/components/schemas/Target"
        text:
          type: string
          description: 메시지 본문. 작아서 그대로 담긴다.
        format:
          type: string
          enum: [json, csv, source]
          description: 데이터 파일 형식. `source`는 API 원본(후속 단계).
        schema:
          type: string
          description: "sidecar의 데이터 스키마 참조. 예: `resume#/base`."
        template:
          type: string
          description: "`name@version` 형식."
        bindings:
          type: object
          description: slot 이름에서 데이터 블록 id로.
          additionalProperties:
            type: string
        presets:
          type: object
          description: preset 이름에서 bindings로.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        active_preset:
          type: [string, "null"]
        theme:
          type: object
          description: >-
            템플릿이 편집을 허용하는 스타일 이름(`color.accent`,
            `font.size`)을 키로 하는 스타일 덮어쓰기.
          additionalProperties:
            type: string
        path:
          type: string
        since_run:
          type: integer
        cmd:
          type: string
        cwd:
          type: string
        proc:
          type: string
        url:
          type: string
        repo_bound:
          type: boolean
      examples:
        - id: b04
          type: view
          file: blocks/b04-resume.view.md
          title: 이력서
          created_by: run 1
          template: resume@1
          bindings: {base: b05, overlay: b06}
          presets:
            기본: {base: b05}
            펄어비스: {base: b05, overlay: b06}
          active_preset: 펄어비스
          theme: {color.accent: "#3a5bd9"}

    Block:
      type: object
      description: 블록 머리부와 파일 전체.
      required: [header, content]
      properties:
        header:
          $ref: "#/components/schemas/BlockHeader"
        content:
          type: string
          description: >-
            저장된 그대로의 파일 텍스트. 메시지는 메시지 본문, 데이터 블록은
            JSON 또는 CSV 텍스트.
      examples:
        - header: {id: b05, type: data, file: blocks/b05-base.json, title: 기본 데이터, created_by: run 1, format: json, schema: "resume#/base"}
          content: |
            {
              "name": "김마당",
              "title": "백엔드 엔지니어",
              "contact": {"email": "madang@example.com", "location": "서울"},
              "summary": "대규모 트래픽 서비스의 인증·세션 계층을 설계하고 운영해 온 8년 차 백엔드 엔지니어입니다.",
              "work": [
                {"company": "펄어비스", "role": "게임 서버 엔지니어", "period": "2019.01 – 2022.02", "highlights": ["동시 접속 30만 매치메이킹 서버 개발"]},
                {"company": "한빛소프트", "role": "시니어 백엔드 엔지니어", "period": "2022.03 – 현재", "highlights": ["세션 갱신 경합 제거로 로그인 오류율 92% 감소"]}
              ],
              "skills": ["Kotlin", "TypeScript", "PostgreSQL", "Redis"]
            }

    BlockContent:
      type: object
      required: [content]
      properties:
        content:
          type: string
      examples:
        - content: |
            {"title": "게임 서버 엔지니어 (펄어비스 지원용)"}

    BlockHeaderPatch:
      type: object
      description: 바꿀 머리부 키. 없는 키는 그대로 둔다.
      properties:
        title:
          type: string
        bindings:
          type: object
          additionalProperties:
            type: string
        presets:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        active_preset:
          type: [string, "null"]
        theme:
          type: object
          additionalProperties:
            type: string
      examples:
        - active_preset: 기본
        - bindings: {base: b05, overlay: b06}
        - theme: {color.accent: "#b8322a"}

    BlockCreate:
      type: object
      description: >-
        `doc`과 `data`는 `content`를, `view`는 `template`과 `bindings`나
        `data`를 받는다.
      required: [type, name]
      properties:
        type:
          type: string
          enum: [doc, data, view]
        name:
          type: string
          description: 파일 이름용 slug(`bNN-<name>.<ext>`).
        content:
          type: string
        format:
          type: string
          enum: [json, csv]
          description: 데이터 형식. 기본값 json.
        template:
          type: string
          description: "`name` 또는 `name@version`."
        bindings:
          type: object
          additionalProperties:
            type: string
        data:
          type: array
          items:
            type: string
          description: >-
            `view`의 데이터 블록. `bNN`은 비어 있는 슬롯에 순서대로,
            `slot=bNN`은 그 슬롯에 묶는다. `bindings`와 함께 쓸 수 있다.
        title:
          type: string
          description: "`view`의 제목."
        in_run:
          type: boolean
          default: false
          description: >-
            에이전트 실행 안에서 보낸 요청이면 참(`madang view create`가
            `MADANG_PAGE`로 불렸을 때). 참이고 그 페이지에서 실행이 돌고
            있을 때만 `created_by`에 실행 번호를 붙인다.
      examples:
        - type: view
          name: resume
          template: resume@1
          bindings: {base: b05}

    # 메모리

    MemoryLayer:
      type: string
      description: >-
        메모리 층. profile은 앱 홈 profile.md(나), brief는 프로젝트
        `.madang/brief.md`, ledger는 페이지 ledger.md.
      enum: [profile, brief, ledger]

    MemoryFile:
      type: object
      required: [layer, path, content, tokens]
      properties:
        layer:
          $ref: "#/components/schemas/MemoryLayer"
        path:
          type: string
          description: 파일의 절대 경로.
        content:
          type: string
          description: front matter를 포함한 파일 전체.
        tokens:
          type: integer
          description: 토큰 수(tiktoken cl100k_base).
        token_limit:
          type: [integer, "null"]
          description: 저장 시 강제하는 한도(ledger.md만).
      examples:
        - layer: ledger
          path: /Users/me/Documents/jobs/.madang/pages/2026-09-24-resume/ledger.md
          content: |
            ---
            status: review
            kind: build
            tier: 1
            attempts: 0
            owner: codex/gpt-6-luna
            decisions: []
            tasks:
              - {id: T1, title: 이력서 뷰 만들기, status: done}
              - {id: T2, title: 펄어비스용 프리셋, status: review}
            artifacts:
              - blocks/b04-resume.view.md
              - blocks/b05-base.json
              - blocks/b06-pearlabyss.json
            ---
            ## 목표
            이력서 뷰 하나로 지원처별 프리셋을 전환할 수 있다.

            ## 다음 할 일
            1. 펄어비스 프리셋 결과를 사람이 검토한다.

            ## 로그
            2026-09-24 | codex/gpt-6-luna | run 2 | work 순서 변경
          tokens: 212
          token_limit: 2000

    Memory:
      type: object
      description: 에이전트가 받는 기억 세 층. 앱은 이 순서로 보여 준다.
      required: [profile, brief, ledger]
      properties:
        profile:
          $ref: "#/components/schemas/MemoryFile"
        brief:
          $ref: "#/components/schemas/MemoryFile"
        ledger:
          $ref: "#/components/schemas/MemoryFile"
      examples:
        - profile:
            layer: profile
            path: /Users/me/.madang/profile.md
            content: |
              # 나에 대해
              한국어로 답한다. 확인 질문 없이 진행한다.
            tokens: 18
            token_limit: null
          brief:
            layer: brief
            path: /Users/me/Documents/jobs/.madang/brief.md
            content: |
              지원서와 이력서를 다룬다. 사실은 base 데이터만 믿는다.
            tokens: 41
            token_limit: null
          ledger:
            layer: ledger
            path: /Users/me/Documents/jobs/.madang/pages/2026-09-24-resume/ledger.md
            content: |
              ---
              status: review
              kind: build
              tier: 1
              attempts: 0
              ---
              ## 목표
              이력서 뷰 하나로 지원처별 프리셋을 전환할 수 있다.

              ## 다음 할 일
              1. 펄어비스 프리셋 결과를 사람이 검토한다.
            tokens: 74
            token_limit: 2000

    MemoryContent:
      type: object
      required: [content]
      properties:
        content:
          type: string
      examples:
        - content: |
            # 나에 대해
            한국어로 답한다.

    # 메시지와 입력

    MessageCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: "`design:` 같은 접두어가 종류를 강제한다."
        target:
          $ref: "#/components/schemas/Target"
      examples:
        - text: 펄어비스 경력을 맨 위로
          target: {block: b04, elements: ["work[1]"], mode: edit}

    MessageAccepted:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 저장된 메시지 블록의 id.
      examples:
        - message: b07

    InputParts:
      type: object
      description: 입력 부분별 추정 토큰.
      required: [system_est, profile, brief, ledger, contract, target, request]
      properties:
        system_est:
          type: integer
          description: runner 자체의 시스템 프롬프트와 도구(상수).
        profile:
          type: integer
          description: profile.md 본문.
        brief:
          type: integer
          description: brief.md 본문.
        ledger:
          type: integer
          description: ledger.md(머리부와 본문).
        contract:
          type: integer
          description: 내장 작업 지시문.
        target:
          type: integer
        request:
          type: integer
      examples:
        - {system_est: 24600, profile: 110, brief: 1840, ledger: 1320, contract: 420, target: 900, request: 40}

    RunInput:
      type: object
      required: [parts, total_est]
      properties:
        parts:
          $ref: "#/components/schemas/InputParts"
        total_est:
          type: integer
      examples:
        - parts: {system_est: 24600, profile: 110, brief: 1840, ledger: 1320, contract: 420, target: 900, request: 40}
          total_est: 29230

    InputPreview:
      type: object
      description: 다음 호출이 어떻게 라우팅되고 무엇을 읽는지.
      required: [kind, tier, runner, model, parts, total_est]
      properties:
        kind:
          type: string
        tier:
          type: integer
        runner:
          type: string
        model:
          type: string
        effort:
          type: string
        parts:
          $ref: "#/components/schemas/InputParts"
        total_est:
          type: integer
      examples:
        - kind: small
          tier: 1
          runner: codex
          model: gpt-6-luna
          effort: high
          parts: {system_est: 24600, profile: 110, brief: 1840, ledger: 1320, contract: 420, target: 900, request: 40}
          total_est: 29230

    # 실행

    RunResultStatus:
      type: string
      description: >-
        runner가 끝난 방식(`error`, `cancelled`, 시간 초과는 `blocked`), 또는
        정상 종료 뒤 ledger.md의 status.
      enum: [planning, doing, blocked, review, done, error, cancelled]

    RunTrigger:
      type: object
      properties:
        message:
          type: string
        target:
          type: string
        elements:
          type: array
          items:
            type: string
        mode:
          $ref: "#/components/schemas/TargetMode"
      examples:
        - {message: b07, target: b04, elements: ["work[1]"], mode: edit}

    RunUsage:
      type: object
      description: 토큰 수. `input`은 `cached`를 포함한다.
      required: [input, cached, output]
      properties:
        input:
          type: integer
        cached:
          type: integer
        output:
          type: integer
      examples:
        - {input: 29104, cached: 24310, output: 612}

    RunVerify:
      type: object
      properties:
        cmd:
          type: [string, "null"]
        ok:
          type: [boolean, "null"]
      examples:
        - {cmd: null, ok: null}

    RunRecord:
      type: object
      description: runs/N.json 형식의 run 기록.
      required: [n, usage, changed_files, unknown_files, verify]
      properties:
        n:
          type: integer
        started:
          type: [string, "null"]
          format: date-time
        finished:
          type: [string, "null"]
          format: date-time
        trigger:
          $ref: "#/components/schemas/RunTrigger"
        kind:
          type: string
        tier:
          type: integer
        runner:
          type: string
        model:
          type: string
        effort:
          type: string
        input:
          $ref: "#/components/schemas/RunInput"
        usage:
          $ref: "#/components/schemas/RunUsage"
        changed_files:
          type: array
          items:
            type: string
        unknown_files:
          type: array
          items:
            type: string
        verify:
          $ref: "#/components/schemas/RunVerify"
        result_status:
          $ref: "#/components/schemas/RunResultStatus"
        events_log:
          type: [string, "null"]
          description: 원본 이벤트 스트림의 페이지 기준 경로.
        fallback:
          $ref: "#/components/schemas/RunFallbackData"
          description: >-
            러너를 쓸 수 없거나 조기 실패해 대체표의 러너로 바꿔 실행했으면
            그 대체. 바꾸지 않았으면 없다.
      examples:
        - n: 2
          started: "2026-09-24T09:31:00+09:00"
          finished: "2026-09-24T09:31:41+09:00"
          trigger: {message: b07, target: b04, elements: ["work[1]"], mode: edit}
          kind: small
          tier: 1
          runner: codex
          model: gpt-6-luna
          effort: high
          input:
            parts: {system_est: 24600, profile: 110, brief: 1840, ledger: 1320, contract: 420, target: 900, request: 40}
            total_est: 29230
          usage: {input: 29104, cached: 24310, output: 612}
          changed_files: [blocks/b05-base.json]
          unknown_files: []
          verify: {cmd: null, ok: null}
          result_status: review
          events_log: runs/2.jsonl

    RunStreamEvent:
      type: object
      description: >-
        도구에 중립인 runner 이벤트 하나. `type`에 해당하는 필드만 채운다:
        text는 `text`, tool_call은 `name`·`summary`, tool_result는
        `summary`, file_changed는 `path`, usage는 `usage`, done은 `text`,
        error는 `message`.
      required: [type]
      properties:
        type:
          type: string
          enum: [text, tool_call, tool_result, file_changed, usage, done, error]
        text:
          type: string
        name:
          type: string
        summary:
          type: string
        path:
          type: string
        usage:
          $ref: "#/components/schemas/RunUsage"
        message:
          type: string
      examples:
        - type: tool_call
          name: apply_patch
          summary: blocks/b05-base.json
        - type: file_changed
          path: blocks/b05-base.json

    # 결정

    Question:
      type: object
      required: [kind, prompt]
      properties:
        kind:
          type: string
          enum: [choice, yesno, score]
        prompt:
          type: string
        options:
          type: [array, "null"]
          items:
            type: string
      examples:
        - kind: choice
          prompt: ledger.md 보정에 실패했습니다. 어떻게 할까요?
          options: [retry, next_tier, stop]

    PendingDecision:
      type: object
      description: flow가 기다리는 질문(ask_human).
      required: [id, question]
      properties:
        id:
          type: string
        run:
          type: [integer, "null"]
        question:
          $ref: "#/components/schemas/Question"
        ask:
          type: string
          description: >-
            정책이 멈춘 질문이면 page.md 묻는 블록의 id. 그 블록으로도 답할 수
            있다(`POST /pages/{page}/asks/{id}/answer`).
        reasons:
          type: array
          description: 정책이 거부한 이유. 묻는 블록이 있을 때만.
          items:
            type: string
      examples:
        - id: b09
          run: 3
          question:
            kind: choice
            prompt: 정책(테스트·충돌·금지 명령)이 머지나 게시를 멈췄습니다. 묻는 블록의 이유를 보고 답해 주세요.
            options: [merge, retry, stop]
          ask: b12
          reasons: ["테스트 실패(종료 코드 1)"]
        - id: q1
          run: 2
          question:
            kind: choice
            prompt: ledger.md 보정에 실패했습니다. 어떻게 할까요?
            options: [retry, next_tier, stop]

    DecisionAnswer:
      type: object
      required: [choice]
      properties:
        choice:
          type: string
          description: >-
            `choice`는 선택지 중 하나, `yesno`는 `true`/`false`, `score`는
            `1`–`5`.
      examples:
        - choice: retry

    # 상태(에이전트)

    TaskStatus:
      type: string
      enum: [todo, doing, blocked, review, done]

    Task:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        due:
          type: string
          format: date
      examples:
        - {id: T2, title: 펄어비스용 프리셋, status: review}

    TaskUpdate:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        title:
          type: string
          description: 새 작업이면 필수.
        due:
          type: string
          format: date
      examples:
        - {id: T2, status: done}

    DecisionState:
      type: string
      enum: [proposed, confirmed, superseded, deferred]

    LedgerDecision:
      type: object
      description: ledger.md `decisions`의 항목 하나.
      required: [id, topic, choice, options, state]
      properties:
        id:
          type: string
        topic:
          type: string
        choice:
          type: string
        options:
          type: array
          items:
            type: string
        by:
          type: string
          description: "`runner/model` 또는 `user`."
        run:
          type: [integer, "null"]
        state:
          $ref: "#/components/schemas/DecisionState"
        supersedes:
          type: [string, "null"]
      examples:
        - id: D1
          topic: 지원처별 차이를 담는 방법
          choice: overlay-preset
          options: [overlay-preset, copy-per-company]
          by: claude/claude-opus-5-5
          run: 1
          state: confirmed
          supersedes: null

    DecisionCreate:
      type: object
      required: [id, topic, choice, options]
      properties:
        id:
          type: string
        topic:
          type: string
        choice:
          type: string
        options:
          type: array
          items:
            type: string
        supersedes:
          type: string
        state:
          type: string
          enum: [proposed, confirmed, superseded, deferred]
          description: 기본값 confirmed.
        by:
          type: string
          description: 결정한 사람. 기본값 human.
        in_run:
          type: boolean
          default: false
          description: >-
            에이전트 실행 안에서 보낸 요청이면 참(`madang decide`가
            `MADANG_PAGE`로 불렸을 때). 참이고 그 페이지에서 실행이 돌고
            있을 때만 결정에 `run`을 붙인다.
      examples:
        - id: D1
          topic: 지원처별 차이를 담는 방법
          choice: overlay-preset
          options: [overlay-preset, copy-per-company]
          by: claude/claude-opus-5-5
          in_run: true

    ArtifactAdd:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 페이지 기준 또는 `repo:`(프로젝트 폴더 기준) 경로.
      examples:
        - path: blocks/b06-pearlabyss.json

    RepoCommit:
      type: object
      required: [message]
      properties:
        message:
          type: string
        page:
          type: [string, "null"]
          description: 요청한 페이지. 워크트리가 있으면 그 안에 커밋한다.
        in_run:
          type: boolean
          default: false
          description: 에이전트 실행 안에서 보냈으면 참(`$MADANG_PAGE`).
      examples:
        - message: "docs: add resume layout notes"
        - message: "feat(session): add refresh lock"
          page: 2026-09-24-lock
          in_run: true

    RepoCommitResult:
      type: object
      required: [commit]
      properties:
        commit:
          type: string
      examples:
        - commit: 7b8c9d0

    RepoPushResult:
      type: object
      required: [branch]
      properties:
        branch:
          type: string
        remote:
          type: string
      examples:
        - branch: main
          remote: origin

    RepoPush:
      type: object
      description: 에이전트의 push 요청. 본문은 없어도 된다.
      properties:
        page:
          type: string
          description: 이 페이지의 워크트리(있으면) 브랜치를 보낸다.
      examples:
        - page: 2026-09-24-lock

    # 설정 파일

    ConfigDocument:
      type: object
      description: 설정 파일(config.yaml) 원문. 주석과 순서를 그대로 둔다.
      required: [text]
      properties:
        text:
          type: string
      examples:
        - text: |
            track: false
            runs:
              - name: 이력서 사이트
                cwd: resume/site
                command: npm run dev
                opens: http://localhost:5173
            policy:
              auto_merge: {require_tests: true, require_no_conflict: true}
              auto_publish: true
              deny: ["push --force", "reset --hard", "clean -fd"]

    # git

    GitFile:
      type: object
      description: 바뀐 파일 하나.
      required: [path, code]
      properties:
        path:
          type: string
          description: 작업 트리 기준 경로.
        code:
          type: string
          description: "`git status --porcelain`의 두 글자 코드(인덱스, 작업 트리). 추적 안 되는 파일은 `??`."
      examples:
        - path: src/session/lock.ts
          code: " M"

    GitStatus:
      type: object
      description: 작업 트리 상태. git 저장소가 아니면 `repository`만 거짓이다.
      required: [repository, folder, files]
      properties:
        repository:
          type: boolean
        folder:
          type: string
          description: 작업 트리의 절대 경로(프로젝트 폴더 또는 페이지 워크트리).
        branch:
          type: string
          description: 체크아웃된 브랜치. HEAD가 분리됐으면 없다.
        head:
          type: string
          description: HEAD 커밋의 전체 해시. 커밋이 없으면 없다.
        files:
          type: array
          items:
            $ref: "#/components/schemas/GitFile"
      examples:
        - repository: true
          folder: /Users/me/src/madang.wt/2026-09-24-lock
          branch: page/2026-09-24-lock
          head: 7b8c9d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708
          files:
            - {path: src/session/lock.ts, code: " M"}
            - {path: src/session/lock.test.ts, code: "??"}
        - repository: false
          folder: /Users/me/Documents/jobs
          files: []

    GitDiff:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: 통합 diff 텍스트(색 없음).
      examples:
        - text: |
            diff --git a/src/session/lock.ts b/src/session/lock.ts
            --- a/src/session/lock.ts
            +++ b/src/session/lock.ts
            @@ -1 +1,2 @@
             export {}
            +export const refreshLock = new Mutex()

    GitStage:
      type: object
      properties:
        paths:
          type: [array, "null"]
          description: 스테이징할 경로. 없으면 모든 변경.
          items:
            type: string
      examples:
        - paths: [src/session/lock.ts]
        - {}

    GitCommitCreate:
      type: object
      required: [message]
      properties:
        message:
          type: string
        paths:
          type: [array, "null"]
          description: 이 경로들만 커밋한다.
          items:
            type: string
      examples:
        - message: "feat(session): add refresh lock"

    GitBranches:
      type: object
      required: [branches]
      properties:
        current:
          type: string
          description: 메인 체크아웃의 브랜치. HEAD가 분리됐으면 없다.
        branches:
          type: array
          items:
            type: string
      examples:
        - current: main
          branches: [main, page/2026-09-24-lock]

    GitWorktree:
      type: object
      required: [path, head, main]
      properties:
        path:
          type: string
        branch:
          type: string
          description: 체크아웃된 브랜치. 분리됐으면 없다.
        head:
          type: string
          description: HEAD 해시. 커밋이 없으면 빈 문자열.
        main:
          type: boolean
          description: 메인 체크아웃이면 참.
        page:
          type: string
          description: 이 워크트리를 쓰는 페이지 id.
      examples:
        - path: /Users/me/src/madang
          branch: main
          head: 7b8c9d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708
          main: true
        - path: /Users/me/src/madang.wt/2026-09-24-lock
          branch: page/2026-09-24-lock
          head: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d
          main: false
          page: 2026-09-24-lock

    GitLogEntry:
      type: object
      required: [hash, author, date, subject]
      properties:
        hash:
          type: string
        author:
          type: string
        date:
          type: string
          format: date-time
        subject:
          type: string
          description: 메시지 첫 줄.
      examples:
        - hash: 7b8c9d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708
          author: choi
          date: "2026-09-24T09:40:00+09:00"
          subject: "feat(session): add refresh lock"

    # 되돌리기

    UndoResult:
      type: object
      description: run 하나를 되감은 결과.
      required: [run, restored, skipped, reverted, unpublished]
      properties:
        run:
          type: integer
        restored:
          type: array
          description: 실행 전 내용으로 되감은 페이지 파일(페이지 기준).
          items:
            type: string
        skipped:
          type: array
          description: 되감지 않는 부작용(`repo:` 작업 트리 파일 등). 커밋·머지 되돌림이 대신 되감는다.
          items:
            type: string
        reverted:
          type: array
          description: git 커밋·머지를 되감은 되돌림 커밋 해시.
          items:
            type: string
        unpublished:
          type: array
          description: 되감은 게시 번호.
          items:
            type: integer
      examples:
        - run: 3
          restored: [ledger.md, page.md]
          skipped: ["repo:src/session/lock.ts"]
          reverted: [9f8e7d6c5b4a39281706f5e4d3c2b1a098f7e6d5]
          unpublished: []

    # 게시

    PublishedViewer:
      type: object
      required: [name, pin]
      properties:
        name:
          type: string
          description: 뷰어 이름(`프로젝트/뷰어`).
        pin:
          type: string
          description: 게시 시점 해시(커밋 또는 내용 해시).
      examples:
        - name: resume/basic
          pin: 3f2a9c1

    PublishRecord:
      type: object
      description: "`.madang/published/<n>.json`의 요약."
      required: [n, at, target, site, documents, viewers]
      properties:
        n:
          type: integer
          description: 게시 번호.
        at:
          type: string
          format: date-time
        target:
          type: string
          description: 설정의 대상(`gh-pages` 또는 `folder:<경로>`).
        site:
          type: string
          description: 사이트 내용 해시.
        documents:
          type: array
          description: 게시한 문서(프로젝트 기준 경로).
          items:
            type: string
        viewers:
          type: array
          items:
            $ref: "#/components/schemas/PublishedViewer"
        branch:
          type: string
          description: gh-pages 대상의 브랜치.
        after_commit:
          type: string
          description: 게시 커밋(브랜치 대상).
        pushed_to:
          type: string
          description: 밀어 넣은 원격. 밀지 않았으면 없다.
        undone:
          type: string
          format: date-time
          description: 되감은 시각. 아직이면 없다.
        undo_commit:
          type: string
          description: 브랜치 대상을 되감은 커밋.
      additionalProperties: true
      examples:
        - n: 4
          at: "2026-09-24T10:02:00+09:00"
          target: gh-pages
          site: 5e1c0a9b
          documents: [docs/index.md, docs/resume.md]
          viewers: [{name: resume/basic, pin: 3f2a9c1}]
          branch: gh-pages
          after_commit: 0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e
          pushed_to: origin

    PublishStatus:
      type: object
      required: [include, auto_publish]
      properties:
        target:
          type: string
          description: "`publish.target`. 없으면 게시할 수 없다."
        include:
          type: array
          description: 게시할 경로(프로젝트 기준). `.madang/`은 늘 빠진다.
          items:
            type: string
        auto_publish:
          type: boolean
          description: 문서가 바뀐 send 뒤에 정책이 자동으로 게시하는지.
        latest:
          $ref: "#/components/schemas/PublishRecord"
          description: 마지막 게시. 없으면 없다.
      examples:
        - target: gh-pages
          include: [docs]
          auto_publish: true

    PublishOutcome:
      type: object
      required: [target, changed, documents, warnings]
      properties:
        target:
          type: string
        changed:
          type: boolean
          description: 새로 게시(또는 되감기)해 기록을 남겼으면 참. 대상이 이미 같으면 거짓.
        site:
          type: string
          description: 사이트 내용 해시. 되감기면 없다.
        documents:
          type: integer
          description: 게시한 문서 수.
        warnings:
          type: array
          description: 표로 대체된 뷰어 펜스 등.
          items:
            type: string
        push_error:
          type: string
          description: 게시 브랜치를 밀다 실패한 이유.
        record:
          $ref: "#/components/schemas/PublishRecord"
      examples:
        - target: folder:site
          changed: true
          site: 5e1c0a9b
          documents: 2
          warnings: []
          record:
            n: 4
            at: "2026-09-24T10:02:00+09:00"
            target: folder:site
            site: 5e1c0a9b
            documents: [docs/index.md, docs/resume.md]
            viewers: []

    # 실행 대상과 포트

    ObservedPort:
      type: object
      description: 관찰한 LISTEN 포트 하나(운영체제가 알려 준 사실).
      required: [port, host, pid]
      properties:
        port:
          type: integer
        host:
          type: string
          description: 대기 주소.
        pid:
          type: integer
          description: 포트를 연 프로세스.
        command:
          type: string
          description: 그 프로세스의 명령줄.
        cwd:
          type: string
          description: 그 프로세스의 작업 폴더(프로젝트 또는 워크트리 기준).
        run:
          type: string
          description: core가 띄운 실행 대상의 이름. 선언 밖 프로세스면 없다.
      examples:
        - port: 5173
          host: 127.0.0.1
          pid: 48213
          command: node /Users/me/jobs/resume/site/node_modules/.bin/vite
          cwd: resume/site
          run: 이력서 사이트

    RunTargetStatus:
      type: object
      description: "`runs:`에 선언한 실행 대상과 지금 상태."
      required: [name, command, cwd, running, ports]
      properties:
        name:
          type: string
        command:
          type: string
          description: 셸 명령.
        cwd:
          type: string
          description: 프로젝트 기준 실행 폴더.
        opens:
          type: string
          description: 준비되면 브라우저 탭으로 열 URL.
        running:
          type: boolean
          description: core가 띄운 프로세스가 돌고 있는지.
        pid:
          type: integer
        ports:
          type: array
          description: 그 프로세스 트리가 연 포트.
          items:
            $ref: "#/components/schemas/ObservedPort"
      examples:
        - name: 이력서 사이트
          command: npm run dev
          cwd: resume/site
          opens: http://localhost:5173
          running: true
          pid: 48201
          ports: [{port: 5173, host: 127.0.0.1, pid: 48213, run: 이력서 사이트}]

    RunDeclare:
      type: object
      required: [name, command]
      properties:
        name:
          type: string
          description: 프로젝트 안에서 겹치지 않는 이름.
        command:
          type: string
        cwd:
          type: string
          default: "."
          description: 프로젝트 기준 상대 경로. 밖을 가리키면 400.
        opens:
          type: [string, "null"]
      examples:
        - name: 이력서 사이트
          command: npm run dev
          cwd: resume/site
          opens: http://localhost:5173

    PortDeclare:
      type: object
      required: [name]
      properties:
        name:
          type: string
        command:
          type: [string, "null"]
          description: 없으면 포트를 연 프로세스의 명령줄.
        cwd:
          type: [string, "null"]
          description: 없으면 그 프로세스의 작업 폴더.
      examples:
        - name: vite 개발 서버
        - name: 문서 미리보기
          command: npm run docs
          cwd: docs

    # 뷰어

    ViewerStatus:
      type: object
      required: [name, source, follow, status, scope]
      properties:
        name:
          type: string
          description: "`프로젝트/뷰어` 이름."
        source:
          type: string
          description: 정본 뷰어 폴더(복사하지 않는다).
        follow:
          type: string
          enum: [live, pinned]
          description: live는 정본 변경을 따라가고, pinned는 해시 사본을 쓴다.
        pinned:
          type: string
          description: pinned일 때 사본의 해시.
        status:
          type: string
          enum: [ok, broken]
          description: 정본 폴더가 없거나 규격이 깨졌으면 broken(끊김).
        scope:
          type: string
          enum: [registry, project]
          description: 등록부 항목인지, 프로젝트 `.madang/viewers/`의 뷰어인지.
        project:
          type: string
          description: scope가 project일 때 프로젝트 id.
        version:
          type: string
          description: viewer.json의 버전. 끊겼으면 없다.
      examples:
        - name: resume/basic
          source: /Users/me/src/viewers/resume-basic
          follow: live
          status: ok
          scope: registry
          version: "1.0.0"
        - name: jobs/cards
          source: /Users/me/old/cards
          follow: pinned
          pinned: 3f2a9c1
          status: broken
          scope: registry

    ViewerRegister:
      type: object
      required: [source]
      properties:
        source:
          type: string
          description: 뷰어 폴더(viewer.json이 있는 곳). `~`는 사용자 홈으로 푼다.
        follow:
          type: string
          enum: [live, pinned]
          default: live
      examples:
        - source: ~/src/viewers/resume-basic
          follow: live

    # 사용량

    ModelUsage:
      type: object
      required: [model, messages, input_tokens, output_tokens, cache_read_tokens, cache_creation_tokens]
      properties:
        model:
          type: string
        messages:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_creation_tokens:
          type: integer
      examples:
        - {model: claude-opus-5-5, messages: 30, input_tokens: 900, output_tokens: 30000, cache_read_tokens: 1800000, cache_creation_tokens: 70000}

    DayUsage:
      type: object
      required: [date, messages, input_tokens, output_tokens, cache_read_tokens, cache_creation_tokens]
      properties:
        date:
          type: string
          format: date
          description: 로컬 날짜.
        messages:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_creation_tokens:
          type: integer
      examples:
        - {date: "2026-09-24", messages: 12, input_tokens: 300, output_tokens: 9000, cache_read_tokens: 600000, cache_creation_tokens: 20000}

    UsageWindow:
      type: object
      description: |
        지금에서 거슬러 올라간 사용량 창 하나. 한도를 모르면 `limit_tokens`와
        `percent`가 없다.
      required: [name, start, end, used_tokens, warn]
      properties:
        name:
          type: string
          description: 창 이름. `5h`는 5시간, `week`는 7일.
          enum: ["5h", week]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: 창의 끝. 사용량을 확인한 시각이다.
        used_tokens:
          type: integer
          description: 창 안의 입력·출력·캐시 읽기·캐시 쓰기 토큰 합.
        limit_tokens:
          type: integer
          description: 창의 토큰 한도. 근거가 있을 때만.
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: 한도 대비 사용 비율. 한도를 알 때만.
        warn:
          type: boolean
          description: 사용 비율이 80% 이상이면 참. 비율을 모르면 거짓.
      examples:
        - {name: "5h", start: "2026-09-24T05:00:00+09:00", end: "2026-09-24T10:00:00+09:00", used_tokens: 820000, warn: false}

    ToolUsage:
      type: object
      description: |
        도구 하나(claude, codex)의 사용 합계와 사용량 창. `input_tokens`는
        캐시에서 읽지 않은 입력이다. Codex는 추론 토큰이 `output_tokens`에
        들어 있고 캐시 쓰기는 0이다.
      required: [tool, available, sessions, models, days, windows, warn, messages, input_tokens, output_tokens, cache_read_tokens, cache_creation_tokens]
      properties:
        tool:
          type: string
          enum: [claude, codex]
        available:
          type: boolean
          description: 사용 기록 폴더가 있으면 참.
        sessions:
          type: integer
          description: 기간 안에 사용량이 있는 세션 수.
        messages:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_creation_tokens:
          type: integer
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelUsage"
        days:
          type: array
          items:
            $ref: "#/components/schemas/DayUsage"
        windows:
          type: array
          description: 5시간 창과 7일 창.
          items:
            $ref: "#/components/schemas/UsageWindow"
        warn:
          type: boolean
          description: 경고 중인 창이 하나라도 있으면 참.
      examples:
        - tool: claude
          available: true
          sessions: 5
          messages: 42
          input_tokens: 1200
          output_tokens: 38000
          cache_read_tokens: 2100000
          cache_creation_tokens: 90000
          models:
            - {model: claude-opus-5-5, messages: 42, input_tokens: 1200, output_tokens: 38000, cache_read_tokens: 2100000, cache_creation_tokens: 90000}
          days:
            - {date: "2026-09-24", messages: 42, input_tokens: 1200, output_tokens: 38000, cache_read_tokens: 2100000, cache_creation_tokens: 90000}
          windows:
            - {name: "5h", start: "2026-09-24T05:00:00+09:00", end: "2026-09-24T10:00:00+09:00", used_tokens: 820000, warn: false}
            - {name: week, start: "2026-09-17T10:00:00+09:00", end: "2026-09-24T10:00:00+09:00", used_tokens: 2229200, warn: false}
          warn: false

    Usage:
      type: object
      required: [checked, since, tools]
      properties:
        checked:
          type: string
          format: date-time
        since:
          type: string
          format: date
          description: 센 첫날(로컬 날짜, 그날 포함).
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolUsage"
      examples:
        - checked: "2026-09-24T10:00:00+09:00"
          since: "2026-09-18"
          tools:
            - tool: claude
              available: false
              sessions: 0
              messages: 0
              input_tokens: 0
              output_tokens: 0
              cache_read_tokens: 0
              cache_creation_tokens: 0
              models: []
              days: []
              windows:
                - {name: "5h", start: "2026-09-24T05:00:00+09:00", end: "2026-09-24T10:00:00+09:00", used_tokens: 0, warn: false}
                - {name: week, start: "2026-09-17T10:00:00+09:00", end: "2026-09-24T10:00:00+09:00", used_tokens: 0, warn: false}
              warn: false
            - tool: codex
              available: false
              sessions: 0
              messages: 0
              input_tokens: 0
              output_tokens: 0
              cache_read_tokens: 0
              cache_creation_tokens: 0
              models: []
              days: []
              windows:
                - {name: "5h", start: "2026-09-24T05:00:00+09:00", end: "2026-09-24T10:00:00+09:00", used_tokens: 0, warn: false}
                - {name: week, start: "2026-09-17T10:00:00+09:00", end: "2026-09-24T10:00:00+09:00", used_tokens: 0, warn: false}
              warn: false

    # 파일 트리

    FileLens:
      type: string
      description: 파일 트리 렌즈. 전체, 이 페이지, 변경됨.
      enum: [all, page, changed]

    FileEntry:
      type: object
      required: [path, type]
      properties:
        path:
          type: string
          description: 작업 폴더 기준 경로.
        type:
          type: string
          enum: [file, dir]
        runs:
          type: array
          description: 이 폴더를 `cwd`로 선언한 실행 대상. 선언된 것에만 있다.
          items:
            type: string
        change:
          type: string
          description: "`changed` 렌즈에서 git 상태 코드."
      examples:
        - {path: .madang, type: dir}
        - {path: .madang/brief.md, type: file}
        - {path: resume/site, type: dir, runs: [이력서 사이트]}
        - {path: src/session/lock.ts, type: file, change: " M"}

    FileTree:
      type: object
      required: [root, lens, entries, runs, truncated]
      properties:
        root:
          type: string
          description: 훑은 작업 폴더의 절대 경로.
        lens:
          $ref: "#/components/schemas/FileLens"
        entries:
          type: array
          description: 폴더가 그 안의 파일보다 먼저 오는 순서. `.madang/`이 맨 앞.
          items:
            $ref: "#/components/schemas/FileEntry"
        runs:
          type: array
          description: "작업 폴더 자체(`cwd: .`)에 선언된 실행 대상."
          items:
            type: string
        truncated:
          type: boolean
          description: 항목이 너무 많아 잘랐으면 참.
      examples:
        - root: /Users/me/Documents/jobs
          lens: all
          entries:
            - {path: .madang, type: dir}
            - {path: .madang/brief.md, type: file}
            - {path: resume, type: dir}
            - {path: resume/site, type: dir, runs: [이력서 사이트]}
            - {path: resume/site/index.html, type: file}
          runs: []
          truncated: false

    # 파일과 휴지통

    UnknownFile:
      type: object
      description: run이 만들었지만 등록하지 않은 파일.
      required: [path]
      properties:
        path:
          type: string
          description: 페이지 기준 경로, 코드 저장소면 `repo:` 접두어.
        run:
          type: [integer, "null"]
          description: 이 파일을 발견한 run.
      examples:
        - path: blocks/notes.txt
          run: 2

    UnknownFileAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [artifact, keep, delete]
      examples:
        - action: artifact

    TrashEntry:
      type: object
      description: |
        프로젝트의 `.madang/trash/<id>/`에 옮겨 둔 삭제 하나. 복원하면
        원래 자리로 되돌려 옮기고 항목은 사라진다.
      required: [id, deleted, project, page, paths]
      properties:
        id:
          type: string
          description: 항목 id(`<YYYYMMDDTHHMMSSffffff>-<page|bNN>`).
        deleted:
          type: string
          format: date-time
        project:
          type: string
          description: 프로젝트 id.
        page:
          type: string
        block:
          type: [string, "null"]
          description: 페이지 전체가 삭제됐으면 null.
        paths:
          type: array
          description: 지워진 경로(프로젝트 폴더 기준). 메시지 블록이면 비어 있다.
          items:
            type: string
      examples:
        - id: 20260923T180211045122-page
          deleted: "2026-09-23T18:02:11+09:00"
          project: jobs
          page: 2026-09-20-cover-letter
          block: null
          paths: [.madang/pages/2026-09-20-cover-letter]
        - id: 20260923T181530998001-b04
          deleted: "2026-09-23T18:15:30+09:00"
