    # 블록

    BlockType:
      type: string
      enum: [message, doc, data, view, code, term, site, run]

    MessageRole:
      type: string
      enum: [user, router, agent]

    TargetMode:
      type: string
      enum: [view, edit]

    Target:
      type: object
      description: 메시지가 향하는 대상. 비어 있으면 페이지.
      properties:
        block:
          type: string
        elements:
          type: array
          description: "요소 데이터 경로. 예: `work[1].company`."
          items:
            type: string
        mode:
          $ref: "#/components/schemas/TargetMode"
      examples:
        - block: b04
          elements: ["work[1]"]
          mode: edit

    BlockHeader:
      type: object
      description: |
        블록 머리부. 공통 키가 먼저 나오고 나머지는 한 종류에만 속한다:
        message(`role`, `ts`, `run`, `target`, `text`), data(`format`,
        `schema`), view(`template`, `bindings`, `presets`, `active_preset`,
        `theme`), code(`path`, `since_run`), term(`cmd`, `cwd`, `proc`),
        site(`url`, `repo_bound`).
      required: [id, type]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/BlockType"
        file:
          type: [string, "null"]
          description: 페이지 기준 파일. 메시지는 log.md에 있어 null.
        title:
          type: string
        created_by:
          type: string
          description: "`run N` 또는 `user`."
        role:
          $ref: "#/components/schemas/MessageRole"
        ts:
          type: string
          format: date-time
        run:
          type: integer
          description: 메시지를 쓴 run, 또는 메시지가 일으킨 run.
        target:
          $ref: "#/components/schemas/Target"
        text:
          type: string
          description: 메시지 본문. 작아서 그대로 담긴다.
        format:
          type: string
          enum: [json, csv, source]
          description: 데이터 파일 형식. `source`는 API 원본(후속 단계).
        schema:
          type: string
          description: "sidecar의 데이터 스키마 참조. 예: `resume#/base`."
        template:
          type: string
          description: "`name@version` 형식."
        bindings:
          type: object
          description: slot 이름에서 데이터 블록 id로.
          additionalProperties:
            type: string
        presets:
          type: object
          description: preset 이름에서 bindings로.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        active_preset:
          type: [string, "null"]
        theme:
          type: object
          description: >-
            템플릿이 편집을 허용하는 스타일 이름(`color.accent`,
            `font.size`)을 키로 하는 스타일 덮어쓰기.
          additionalProperties:
            type: string
        path:
          type: string
        since_run:
          type: integer
        cmd:
          type: string
        cwd:
          type: string
        proc:
          type: string
        url:
          type: string
        repo_bound:
          type: boolean
      examples:
        - id: b04
          type: view
          file: blocks/b04-resume.view.md
          title: 이력서
          created_by: run 1
          template: resume@1
          bindings: {base: b05, overlay: b06}
          presets:
            기본: {base: b05}
            펄어비스: {base: b05, overlay: b06}
          active_preset: 펄어비스
          theme: {color.accent: "#3a5bd9"}

    Block:
      type: object
      description: 블록 머리부와 파일 전체.
      required: [header, content]
      properties:
        header:
          $ref: "#/components/schemas/BlockHeader"
        content:
          type: string
          description: >-
            저장된 그대로의 파일 텍스트. 메시지는 메시지 본문, 데이터 블록은
            JSON 또는 CSV 텍스트.
      examples:
        - header: {id: b05, type: data, file: blocks/b05-base.json, title: 기본 데이터, created_by: run 1, format: json, schema: "resume#/base"}
          content: |
            {
              "name": "김마당",
              "title": "백엔드 엔지니어",
              "contact": {"email": "madang@example.com", "location": "서울"},
              "summary": "대규모 트래픽 서비스의 인증·세션 계층을 설계하고 운영해 온 8년 차 백엔드 엔지니어입니다.",
              "work": [
                {"company": "펄어비스", "role": "게임 서버 엔지니어", "period": "2019.01 – 2022.02", "highlights": ["동시 접속 30만 매치메이킹 서버 개발"]},
                {"company": "한빛소프트", "role": "시니어 백엔드 엔지니어", "period": "2022.03 – 현재", "highlights": ["세션 갱신 경합 제거로 로그인 오류율 92% 감소"]}
              ],
              "skills": ["Kotlin", "TypeScript", "PostgreSQL", "Redis"]
            }

    BlockContent:
      type: object
      required: [content]
      properties:
        content:
          type: string
      examples:
        - content: |
            {"title": "게임 서버 엔지니어 (펄어비스 지원용)"}

    BlockHeaderPatch:
      type: object
      description: 바꿀 머리부 키. 없는 키는 그대로 둔다.
      properties:
        title:
          type: string
        bindings:
          type: object
          additionalProperties:
            type: string
        presets:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        active_preset:
          type: [string, "null"]
        theme:
          type: object
          additionalProperties:
            type: string
      examples:
