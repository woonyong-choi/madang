openapi: 3.1.0
info:
  title: Madang core API
  version: 2.0.0
  summary: madang-core의 로컬 HTTP·WebSocket API.
  description: |
    데스크톱 앱은 이 API로 madang-core와 통신한다. 페이지 기록은 프로젝트
    폴더의 `.madang/`에, 전역 설정(config.yaml)과 profile.md는 앱 홈(`~/.madang`)에 있다.
    둘 다 core가 쓰며 앱은 자체 문서를 두지 않는다. core는 기록을 git에
    커밋하지 않는다(커밋 여부는 사용자가 정한다).

    규약:
    - 시각은 오프셋이 붙은 ISO 8601이다(`2026-09-24T09:40:00+09:00`).
    - 페이지 id는 `YYYY-MM-DD-<slug>`, 블록 id는 `bNN`이다. run 번호는
      페이지별로 늘어나며 재사용하지 않는다.
    - 페이지 안의 경로는 페이지 기준이다(`blocks/b05-base.json`). 프로젝트
      폴더 기준 경로에는 `repo:` 접두어가 붙는다
      (`repo:src/session/lock.ts`).
    - 오류는 `ApiError`로 돌려준다. 파일 검사에 실패하면 400과 함께
      `ValidationFailure`와 그 `issues`를 돌려준다.
    - 변경은 `/events` WebSocket으로 알린다. 앱은 재연결 후 전부 다시
      가져온다.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:7470
    description: 로컬 core. 포트는 다를 수 있으며 core가 core.port에 적는다.
tags:
  - name: system
  - name: setup
    description: 앱 홈(전역 설정) 초기화와 설정 파일 편집.
  - name: projects
    description: 페이지 기록을 `.madang/`에 담는 로컬 폴더.
  - name: pages
  - name: blocks
  - name: memory
  - name: messages
  - name: runs
  - name: decisions
  - name: files
  - name: trash
  - name: templates
  - name: runners
  - name: git
    description: 프로젝트 git(상태·디프·스테이지·커밋·브랜치·워크트리·이력·원격). core만 git을 실행한다.
  - name: publish
    description: 문서 렌더러로 만든 정적 사이트 게시와 되감기.
  - name: viewers
    description: 뷰어 등록부(참조)와 상태.
  - name: agent
    description: madang CLI가 하는 ledger.md·저장소 변경.
  - name: events

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: core가 떠 있는지 알린다.
      responses:
        "200":
          description: core가 실행 중이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /runners:
    get:
      tags: [runners]
      operationId: listRunners
      summary: runner별 사용 가능 여부.
      description: |
        시작할 때와 매 run 전에 확인하고 5분간 캐시한다
        (`claude auth status`, `codex login status`, API runner는 키 유무).
        변경은 `runner.availability`로도 알린다.
      responses:
        "200":
          description: 최근 확인 결과.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerAvailability"

  /usage:
    get:
      tags: [runners]
      operationId: getUsage
      summary: 구독 도구의 토큰 사용량.
      description: |
        Claude Code가 `~/.claude/projects/`·`~/.claude/transcripts/`에 남긴
        대화 기록의 `usage`와, Codex가 `~/.codex/sessions/`에 남긴 기록의
        `token_count` 이벤트만 센다. 인증·설정 파일은 읽지 않는다. 한 응답이
        여러 줄로 되풀이되면(Claude는 `message.id`와 `requestId`, Codex는
        시각과 사용량 값으로) 한 번만 센다. 기록 폴더가 없으면 그 도구의
        `available`이 거짓이다.

        도구마다 사용량 창(`windows`) 둘을 준다: 지금까지 5시간(`5h`)과
        7일(`week`). 창은 지금에서 거슬러 올라간 구간이며 구독의 초기화
        시각과 맞춘 것이 아니다. 플랜별 토큰 한도의 근거가 없으므로
        `limit_tokens`와 `percent`는 비어 있고 `warn`은 거짓이다. 비율을 알
        때는 80% 이상이면 `warn`이 참이다.
      parameters:
        - name: days
          in: query
          required: false
          description: 오늘을 포함해 셀 날 수.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
          example: 7
      responses:
        "200":
          description: 기간 안의 사용 합계.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "400":
          $ref: "#/components/responses/Invalid"

  /home:
    get:
      tags: [setup]
      operationId: getHome
      summary: core가 쓰는 앱 홈(전역 설정 폴더)과 초기화 여부.
      description: |
        `initialized`가 거짓이면 앱은 온보딩을 보여 주고 `POST /home`으로
        앱 홈을 만든다. 초기화 전의 core는 빈 앱 홈처럼 답한다: 목록은
        비어 있고, 프로젝트·페이지 경로는 404, 만들기와 설정은 409.
        예전 구조(`spaces/`가 있는 앱 홈)는 초기화되지 않은 것으로 보며,
        만들기와 설정은 옮기는 방법을 담은 409로 거절한다.
      responses:
        "200":
          description: 앱 홈 상태.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeStatus"
    post:
      tags: [setup]
      operationId: initHome
      summary: 앱 홈을 만들고(이미 있으면 그대로) core가 그 홈을 쓰게 한다.
      description: |
        `path`에 전역 설정(config.yaml, viewers.yaml)과 profile.md를 만든다. git 저장소는 만들지
        않으며 기존 파일은 덮어쓰지 않는다. 예전 구조의 폴더이거나 앱 홈이
        아닌 폴더면 409. core는 이후 이 홈을 쓰고 `core.port`도 이 홈에
        둔다. 프로젝트는 `POST /projects`로 따로 등록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeInit"
      responses:
        "200":
          description: 초기화된 앱 홈.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "409":
          $ref: "#/components/responses/Conflict"

  /config/routes:
    get:
      tags: [setup]
      operationId: getRoutes
      summary: config.yaml의 routes 절 원문.
      responses:
        "200":
          description: 라우팅 표.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutesDocument"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      tags: [setup]
      operationId: saveRoutes
      summary: config.yaml의 routes 절을 바꾼다. 검사를 통과해야 저장된다.
      description: |
        YAML 문법, 필수 키(`kinds`, `default_kind`, `tiers`), 스키마, 종류와
        runner 참조를 검사한다. 실패하면 파일은 그대로다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutesDocument"
      responses:
        "200":
          description: 저장된 라우팅 표.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutesDocument"
        "400":
          $ref: "#/components/responses/Invalid"
        "409":
          $ref: "#/components/responses/Conflict"

  /config:
    get:
      tags: [setup]
      operationId: getConfig
      summary: 앱 홈 config.yaml 원문.
      description: 파일이 없으면 내장 기본값의 원문이다. 에이전트는 이 파일을 받지 않는다.
      responses:
        "200":
          description: 설정 원문.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDocument"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      tags: [setup]
      operationId: saveConfig
      summary: 앱 홈 config.yaml을 검사해 통째로 바꾼다.
      description: |
        스키마와 맞지 않으면 저장하지 않고 400과 함께 줄 번호·키 경로를 담은
        `issues`를 돌려준다(`code`는 `invalid-yaml` 또는 `invalid-value`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigDocument"
      responses:
        "200":
          description: 저장한 원문.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDocument"
        "400":
          $ref: "#/components/responses/Invalid"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 등록한 프로젝트 목록(등록 순서).
      responses:
        "200":
          description: 모든 프로젝트.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [projects]
      operationId: createProject
      summary: 로컬 폴더를 프로젝트로 등록하고 `.madang/`을 만든다.
      description: |
        폴더에 `.madang/`(brief.md, config.yaml, pages/)을 만들고 앱 홈
        `config.yaml`의 `projects`에 등록한다. 이미 있는 `.madang/` 파일은
        덮어쓰지 않는다. 프로젝트 `config.yaml`의 `track`이 거짓(기본)이면
        `.madang/`을 `.git/info/exclude`에 더하고, 참이면 scratch/, trash/만
        뺀다. id를 생략하면 폴더 이름의 슬러그를 쓰고, 겹치면 `-2`처럼
        번호를 붙인다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: 등록한 프로젝트.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}:
    parameters:
      - $ref: "#/components/parameters/Project"
    patch:
      tags: [projects]
      operationId: updateProject
      summary: 프로젝트의 제목, 상위 프로젝트, 아이콘, 색, 정렬을 바꾼다.
      description: 표시 설정은 앱 홈 `config.yaml`의 `projects`에 둔다. 폴더 경로는 바꾸지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: 수정된 프로젝트.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: 프로젝트 등록을 지운다. 폴더와 `.madang/`은 그대로 둔다.
      description: 하위 프로젝트가 있으면 409.
      responses:
        "204":
          description: 등록을 지웠다.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/pages:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [pages]
      operationId: listPages
      summary: 프로젝트의 페이지를 카드로 나열한다.
      description: 고정된 페이지가 먼저, 그다음은 프로젝트의 `sort` 기준(기본 `updated`, 최신순).
      responses:
        "200":
          description: 페이지 카드.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageCard"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [pages]
      operationId: createPage
      summary: "`.madang/pages/`에 page.md, ledger.md를 갖춘 페이지를 만든다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageCreate"
      responses:
        "201":
          description: 새 페이지.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDetail"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/config:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [setup]
      operationId: getProjectConfig
      summary: 프로젝트 `.madang/config.yaml` 원문.
      description: 파일이 없으면 빈 문자열이다(모든 값이 기본값).
      responses:
        "200":
          description: 설정 원문.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDocument"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [setup]
      operationId: saveProjectConfig
      summary: 프로젝트 `.madang/config.yaml`을 검사해 통째로 바꾼다.
      description: |
        `track`, `runs`, `policy`, `publish`, `viewers` 외의 키나 틀린 값은
        저장하지 않고 400 `issues`로 알린다. 저장하면 `project.updated`를
        낸다. `policy.deny`는 git 하위 명령만 해석한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigDocument"
            example:
              text: |
                track: false
                runs:
                  - name: 이력서 사이트
                    cwd: resume/site
                    command: npm run dev
                    opens: http://localhost:5173
                policy:
                  auto_merge: {require_tests: true, require_no_conflict: true, test: npm test}
                  auto_publish: true
                  deny: ["push --force", "reset --hard", "clean -fd"]
                publish:
                  include: [docs/]
                  target: gh-pages
      responses:
        "200":
          description: 저장한 원문.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDocument"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/files:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [files]
      operationId: listFiles
      summary: 작업 폴더의 파일 트리를 렌즈로 거른다.
      description: |
        `page`를 주면 그 페이지의 워크트리(있으면)를, 아니면 프로젝트 폴더를
        훑는다. git 저장소면 git이 추적하거나 무시하지 않는 파일, 아니면 모든
        파일이다. `.madang/`은 맨 앞에 온다. 렌즈:
        - `all`: 전체.
        - `page`: 페이지 ledger.md의 `artifacts`·`reads`와 run이 바꾼 파일 중
          있는 것(`page` 필요).
        - `changed`: git이 알려 준 변경 파일(git 저장소가 아니면 409 `no_repo`).

        실행 배지(`runs`)는 `runs:`에 선언된 `cwd` 폴더에만 붙는다. 짐작하지
        않는다. 항목이 5000개를 넘으면 자르고 `truncated`가 참이다.
      parameters:
        - name: lens
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FileLens"
          example: all
        - $ref: "#/components/parameters/PageQuery"
      responses:
        "200":
          description: 파일 트리.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileTree"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/git/status:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [git]
      operationId: getGitStatus
      summary: 작업 트리의 변경 파일, 브랜치, HEAD.
      description: |
        git 저장소가 아니면 `repository`가 거짓이고 앱은 "git 시작"
        (`POST /projects/{project}/git/init`)만 보여 준다. 앱 밖에서 한 git
        조작은 여기서 상태로만 보인다.
      parameters:
        - $ref: "#/components/parameters/PageQuery"
      responses:
        "200":
          description: 상태.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/git/diff:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [git]
      operationId: getGitDiff
      summary: 통합 diff 텍스트(디프 탭).
      description: |
        기본은 작업 트리와 인덱스의 차이다. `staged`면 인덱스와 HEAD,
        `base`·`target`을 주면 두 커밋의 차이다.
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - name: staged
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: base
          in: query
          required: false
          description: 비교 기준 커밋이나 브랜치.
          schema:
            type: string
        - name: target
          in: query
          required: false
          description: 비교 대상 커밋이나 브랜치.
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: 이 경로들로 제한한다. 반복할 수 있다.
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitDiff"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/git/stage:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      tags: [git]
      operationId: stageGit
      summary: 변경을 스테이징한다.
      description: "`paths`가 없으면 모든 변경이다. 끝나면 `git.changed`를 낸다."
      parameters:
        - $ref: "#/components/parameters/PageQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitStage"
      responses:
        "200":
          description: 스테이징 뒤의 상태.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/git/commit:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      tags: [git]
      operationId: commitGit
      summary: 스테이징된 변경을 커밋한다.
      description: |
        `paths`를 주면 그 경로만 커밋한다. 스테이징된 것이 없거나 비밀로
        보이는 파일(`.env`, `*.pem` 등)이 바뀌어 있으면 409. 정책이 막으면
        409 `denied`. 끝나면 `git.changed`를 낸다.
      parameters:
        - $ref: "#/components/parameters/PageQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitCommitCreate"
      responses:
        "200":
          description: 새 커밋.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCommitResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/git/branches:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [git]
      operationId: listGitBranches
      summary: 로컬 브랜치와 메인 체크아웃의 현재 브랜치.
      responses:
        "200":
          description: 브랜치.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitBranches"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/git/worktrees:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [git]
      operationId: listGitWorktrees
      summary: 메인 체크아웃과 워크트리, 그 워크트리를 쓰는 페이지.
      description: |
        코드 페이지의 워크트리는 `<프로젝트>.wt/<page-id>/`에 있고 `page`에
        그 페이지 id가 있다. 메인 체크아웃은 `main`이 참이다.
      responses:
        "200":
          description: 워크트리 목록.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitWorktree"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/git/log:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [git]
      operationId: getGitLog
      summary: "`ref`에서 거슬러 올라가는 커밋, 최근 것부터."
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - name: ref
          in: query
          required: false
          schema:
            type: string
            default: HEAD
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: 커밋 목록.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitLogEntry"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/git/push:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      tags: [git]
      operationId: pushGit
      summary: 현재 브랜치를 같은 이름의 원격 브랜치로 강제 없이 보낸다.
      description: |
        브랜치에 설정된 원격, 없으면 `origin`으로 보낸다. 정책이 막으면 409
        `denied`, 원격이 없거나 거부되면 409. 끝나면 `git.changed`를 낸다.
      parameters:
        - $ref: "#/components/parameters/PageQuery"
      responses:
        "200":
          description: push했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoPushResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/git/pull:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      tags: [git]
      operationId: pullGit
      summary: 빨리 감기로만 당겨 온다.
      description: 갈라졌거나 원격이 없으면 409. 끝나면 `git.changed`를 낸다.
      parameters:
        - $ref: "#/components/parameters/PageQuery"
      responses:
        "200":
          description: 당긴 뒤의 상태.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/git/init:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      tags: [git]
      operationId: initGit
      summary: 프로젝트 폴더를 git 저장소로 만든다("git 시작").
      description: |
        `.madang/`은 프로젝트 `config.yaml`의 `track`대로 `.git/info/exclude`에
        더한다. 이미 저장소면 409. 커밋은 만들지 않는다.
      responses:
        "201":
          description: 새 저장소의 상태.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/runs:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [runs]
      operationId: listRunTargets
      summary: 선언된 실행 대상(`runs:`)과 지금 상태.
      description: 선언 순서다. 선언되지 않은 것은 실행 대상이 아니다.
      responses:
        "200":
          description: 실행 대상 목록.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunTargetStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [runs]
      operationId: declareRunTarget
      summary: 실행 대상을 `runs:`에 선언한다.
      description: |
        다른 절과 주석은 그대로 둔다. 이름이 겹치거나 `cwd`가 프로젝트 밖
        (심볼릭 링크를 따라간 실제 경로 기준)이면 400. 에이전트의
        `madang runs add`도 이 경로를 쓴다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunDeclare"
      responses:
        "201":
          description: 선언한 실행 대상.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTargetStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{project}/runs/{name}/start:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/RunName"
    post:
      tags: [runs]
      operationId: startRunTarget
      summary: 선언된 실행 대상을 core 소유 프로세스로 시작한다.
      description: |
        명령이 정책의 금지 명령에 걸리면 409 `denied`. 출력은 `run.log`로
        보내고, `opens`가 응답하면 `runs.opened`와 `ports.changed`를 낸다.
        이미 돌고 있으면 409.
      responses:
        "200":
          description: 시작한 실행 대상.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTargetStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/runs/{name}/stop:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/RunName"
    post:
      tags: [runs]
      operationId: stopRunTarget
      summary: core가 띄운 실행 대상을 자손 프로세스까지 정지한다.
      description: 돌고 있지 않으면 409.
      responses:
        "200":
          description: 정지한 실행 대상.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTargetStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/ports:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [runs]
      operationId: listPorts
      summary: 프로젝트에서 지금 열린 포트(관찰).
      description: |
        운영체제가 알려 준 LISTEN 소켓만 쓴다. core가 띄운 실행 대상의
        프로세스 트리와, 작업 폴더가 프로젝트 폴더(또는 `<프로젝트>.wt/`) 안인
        프로세스가 대상이다. 포트 번호나 명령을 짐작하지 않는다.
      responses:
        "200":
          description: 열린 포트, 포트 순.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObservedPort"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{project}/ports/{port}/declare:
    parameters:
      - $ref: "#/components/parameters/Project"
      - name: port
        in: path
        required: true
        description: 관찰한 포트 번호.
        schema:
          type: integer
        example: 5173
    post:
      tags: [runs]
      operationId: declarePort
      summary: 관찰한 포트를 연 프로세스를 `runs:`에 선언한다("선언으로 저장").
      description: |
        `command`와 `cwd`를 주지 않으면 그 프로세스의 실제 명령줄과 작업
        폴더를 쓴다. `opens`는 `http://localhost:<port>`다. 지금 열려 있지
        않은 포트면 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortDeclare"
      responses:
        "201":
          description: 선언한 실행 대상.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTargetStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{project}/publish:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      tags: [publish]
      operationId: getPublishStatus
      summary: 게시 설정과 마지막 게시 기록.
      responses:
        "200":
          description: 게시 상태.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [publish]
      operationId: publishProject
      summary: 프로젝트 `publish:`대로 정적 사이트를 만들어 게시한다.
      description: |
        문서 렌더러 하나(앱 문서 탭과 같은 것)로 문서를 싣고, 문서가 쓰는
        뷰어는 게시 시점 해시로 고정한 사본을 담는다. 대상은 `gh-pages`
        브랜치나 `folder:<경로>`다. 브랜치를 원격에 미는 것은 정책
        (`policy.deny`)이 막지 않을 때만이며, 밀다 실패하면 `push_error`에
        남는다. 대상이 이미 같으면 기록하지 않는다(`changed: false`). 설정·대상
        문제는 409이고 `error`는 게시 오류 코드(`target-missing`, `target-invalid`, `include-missing` 등)다.
        끝나면 `publish.done`을 낸다.
      responses:
        "200":
          description: 게시 결과.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishOutcome"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/publish/undo:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      tags: [publish]
      operationId: undoPublish
      summary: 가장 최근 게시를 되감는다.
      description: |
        되감을 게시가 없으면 409 `nothing-to-undo`, 게시 뒤에 대상이 바뀌었으면
        409 `target-changed`. 끝나면 `publish.done`(`undo: true`)을 낸다.
      responses:
        "200":
          description: 되감은 결과.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishOutcome"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/repo/commit:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      tags: [agent]
      operationId: commitRepo
      summary: 에이전트(`madang commit`)가 일한 작업 트리의 모든 변경을 커밋한다.
      description: |
        `page`에 워크트리가 있으면(코드 페이지) 그 워크트리의 페이지 브랜치에,
        아니면 프로젝트 폴더에 커밋한다. `in_run`이 참이고 그 페이지에서 흐름이
        돌고 있으면 커밋을 그 run의 되돌리기 기록에 남긴다. 작업 트리가 git
        저장소가 아니면 409 `no_repo`, 정책이 막으면 409 `denied`. 끝나면
        `git.changed`를 낸다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoCommit"
      responses:
        "200":
          description: 새 커밋.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCommitResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project}/repo/push:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      tags: [agent]
      operationId: pushRepo
      summary: 에이전트(`madang push`)가 일한 작업 트리의 현재 브랜치를 push한다.
      description: |
        `page`에 워크트리가 있으면 그 브랜치를 보낸다. force push는 하지 않으며
        다른 브랜치도 push하지 않는다. 정책(`policy.deny`)이 막으면 409
        `denied`. 본문은 없어도 된다.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoPush"
      responses:
        "200":
          description: push했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoPushResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}:
    parameters:
      - $ref: "#/components/parameters/Page"
    get:
      tags: [pages]
      operationId: getPage
      summary: page.md와 블록 머리부.
      responses:
        "200":
          description: 페이지.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [pages]
      operationId: updatePage
      summary: 제목, 고정, 태그, 블록 순서를 바꾸거나 페이지를 다른 프로젝트로 옮긴다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageUpdate"
      responses:
        "200":
          description: 수정된 카드.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCard"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [pages]
      operationId: deletePage
      summary: 페이지 폴더를 프로젝트의 `.madang/trash/`로 옮긴다. 휴지통에서 복원할 수 있다.
      responses:
        "204":
          description: 휴지통으로 옮겼다.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/blocks:
    parameters:
      - $ref: "#/components/parameters/Page"
    post:
      tags: [blocks]
      operationId: createBlock
      summary: doc, data, view 블록을 만들어 페이지 끝에 붙인다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockCreate"
      responses:
        "201":
          description: 새 블록 머리부.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockHeader"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/blocks/{block}:
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Block"
    get:
      tags: [blocks]
      operationId: getBlock
      summary: 블록 파일 전체.
      responses:
        "200":
          description: 머리부와 파일 내용.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [blocks]
      operationId: replaceBlock
      summary: 블록 파일 전체를 바꾼다(앱에서 직접 편집).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockContent"
      responses:
        "200":
          description: 저장된 블록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [blocks]
      operationId: updateBlockHeader
      summary: 머리부 키만 바꾼다(bindings, presets, theme, title).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockHeaderPatch"
      responses:
        "200":
          description: 새 머리부.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockHeader"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [blocks]
      operationId: deleteBlock
      summary: 블록 파일을 `.madang/trash/`로 옮기고 page.md 순서에서 뺀다.
      responses:
        "204":
          description: 휴지통으로 옮겼다.
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/memory:
    parameters:
      - $ref: "#/components/parameters/Page"
    get:
      tags: [memory]
      operationId: getMemory
      summary: 에이전트가 매 호출마다 읽는 3층 memory.
      responses:
        "200":
          description: profile.md(앱 홈), brief.md(`.madang/`), ledger.md(페이지).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/memory/{layer}:
    parameters:
      - $ref: "#/components/parameters/Page"
      - name: layer
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/MemoryLayer"
    put:
      tags: [memory]
      operationId: saveMemory
      summary: memory 파일 하나를 저장한다. 검사를 통과해야 저장된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryContent"
      responses:
        "200":
          description: 저장된 파일.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryFile"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/messages:
    parameters:
      - $ref: "#/components/parameters/Page"
    post:
      tags: [messages]
      operationId: sendMessage
      summary: 사용자 메시지를 추가하고 run을 시작한다.
      description: |
        run은 `run.*` 이벤트로 알린다. 선택한 요소를 겨냥한 요청
        (`mode: edit`과 `elements`)은 항상 종류 `small`로 실행한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "202":
          description: 메시지를 저장하고 flow를 시작했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAccepted"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/runs/{n}:
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/RunNumber"
    get:
      tags: [runs]
      operationId: getRun
      summary: run 기록(runs/N.json).
      responses:
        "200":
          description: 기록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/runs/{n}/cancel:
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/RunNumber"
    post:
      tags: [runs]
      operationId: cancelRun
      summary: 진행 중인 run을 멈춘다. `cancelled`로 끝난다.
      responses:
        "202":
          description: 멈추는 중. 이어서 `run.failed`가 온다.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/runs/{n}/events:
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/RunNumber"
    get:
      tags: [runs]
      operationId: listRunEvents
      summary: run의 이벤트 로그(runs/N.jsonl).
      description: |
        runner 이벤트를 도착 순서대로 돌려준다. 진행 중인 run이면 그때까지의
        이벤트다. 레이어 1의 run 패널이 읽는다.
      responses:
        "200":
          description: run의 이벤트.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunStreamEvent"
                examples:
                  - - type: text
                      text: work 배열에서 펄어비스 항목을 찾습니다.
                    - type: tool_call
                      name: apply_patch
                      summary: blocks/b05-base.json
                    - type: file_changed
                      path: blocks/b05-base.json
                    - type: usage
                      usage: {input: 29104, cached: 24310, output: 612}
                    - type: done
                      text: work 순서를 바꿨습니다. 펄어비스 경력이 맨 위입니다.
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/runs/{n}/undo:
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/RunNumber"
    post:
      tags: [runs]
      operationId: undoRun
      summary: run 하나의 부작용을 역순으로 되감는다("되돌리기").
      description: |
        recorder가 남긴 `runs/N.undo.json`대로 게시(게시 기록), git 커밋·머지
        (되돌림 커밋, `reset`을 쓰지 않는다), 페이지 파일(실행 전 사본)을
        나중 것부터 되감는다. 그 run 뒤에 파일이 다시 바뀌었거나, 커밋이
        이력에서 사라졌거나, 더 나중 게시가 있거나, 이미 되돌렸으면 아무것도
        바꾸지 않고 409. 흐름이 돌고 있으면 409 `busy`. 끝나면
        `page.updated`, 되돌림 커밋마다 `git.changed`, 되감은 게시마다
        `publish.done`(`undo: true`)을 낸다.
      responses:
        "200":
          description: 되감은 것.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/asks/{id}/answer:
    parameters:
      - $ref: "#/components/parameters/Page"
      - name: id
        in: path
        required: true
        description: page.md 묻는 블록의 id(`ask.created`의 `block`).
        schema:
          type: string
        example: b12
    post:
      tags: [decisions]
      operationId: answerAsk
      summary: 정책이 멈춘 자리의 묻는 블록에 답하고 흐름을 이어 간다.
      description: |
        정책(테스트·충돌·금지 명령·게시 실패)이 부작용을 멈추면 page.md에 묻는
        블록이 생기고 사람은 거기서만 답한다. 답은 page.md에 블록으로 남는다.
        선택지(`merge`, `retry`, `stop` 등)에 없는 답은 400, 그 블록을 기다리는
        흐름이 없으면 404, 흐름이 돌고 있으면 409 `busy`. 같은 결정은
        `POST /pages/{page}/decisions/{id}/answer`로도 답할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionAnswer"
            example:
              choice: merge
      responses:
        "202":
          description: 받았다. 흐름 이벤트가 이어진다.
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/decisions/{id}/answer:
    parameters:
      - $ref: "#/components/parameters/Page"
      - name: id
        in: path
        required: true
        description: "`flow.waiting`으로 받은 대기 중 결정의 id."
        schema:
          type: string
    post:
      tags: [decisions]
      operationId: answerDecision
      summary: 사람 결정에 답해 기다리던 flow를 재개한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionAnswer"
      responses:
        "202":
          description: flow를 재개했다.
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pages/{page}/preview-input:
    parameters:
      - $ref: "#/components/parameters/Page"
    get:
      tags: [messages]
      operationId: previewInput
      summary: 다음 호출이 읽을 내용과 부분별 토큰 추정치.
      description: 앱은 사용자가 입력하는 동안 디바운스해서 호출한다.
      parameters:
        - name: target
          in: query
          required: false
          description: 대상 블록 id. 생략하면 페이지를 대상으로 한다.
          schema:
            type: string
          example: b04
        - name: elements
          in: query
          required: false
          description: 선택한 요소의 데이터 경로.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          example: ["work[1]"]
        - name: mode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TargetMode"
        - name: text
          in: query
          required: false
          description: 지금까지 입력한 요청 문장.
          schema:
            type: string
      responses:
        "200":
          description: 입력 내역.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InputPreview"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/unknown-files:
    parameters:
      - $ref: "#/components/parameters/Page"
    get:
      tags: [files]
      operationId: listUnknownFiles
      summary: run이 남겼지만 artifact로 등록되지 않은 파일.
      responses:
        "200":
          description: 미처리 파일.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnknownFile"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/unknown-files/{path}:
    parameters:
      - $ref: "#/components/parameters/Page"
      - name: path
        in: path
        required: true
        description: >-
          목록에 나온 파일 경로를 한 세그먼트로 퍼센트 인코딩한 값
          (`blocks%2Fnotes.txt`, `repo%3Asrc%2Fscratch.ts`).
        schema:
          type: string
    post:
      tags: [files]
      operationId: resolveUnknownFile
      summary: 알 수 없는 파일 하나를 등록·유지·삭제한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnknownFileAction"
      responses:
        "200":
          description: 아직 처리되지 않은 파일.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnknownFile"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/ledger/tasks:
    parameters:
      - $ref: "#/components/parameters/Page"
    patch:
      tags: [agent]
      operationId: setTask
      summary: ledger.md에 작업을 추가하거나 갱신한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: 저장된 작업.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/ledger/decisions:
    parameters:
      - $ref: "#/components/parameters/Page"
    post:
      tags: [agent]
      operationId: recordDecision
      summary: ledger.md에 결정을 기록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionCreate"
      responses:
        "201":
          description: 저장된 결정.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerDecision"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /pages/{page}/ledger/artifacts:
    parameters:
      - $ref: "#/components/parameters/Page"
    post:
      tags: [agent]
      operationId: addArtifact
      summary: ledger.md의 artifacts에 파일을 등록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactAdd"
      responses:
        "200":
          description: 변경 후 전체 artifacts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                examples:
                  - - blocks/b04-resume.view.md
                    - blocks/b05-base.json
                    - blocks/b06-pearlabyss.json
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /trash:
    get:
      tags: [trash]
      operationId: listTrash
      summary: 최근 삭제된 페이지와 블록, 최신순.
      responses:
        "200":
          description: 등록한 모든 프로젝트의 `.madang/trash/` 항목.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrashEntry"

  /trash/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        description: 휴지통 항목 id.
        schema:
          type: string
        example: 20260923T181200123456-page
    post:
      tags: [trash]
      operationId: restoreTrash
      summary: 휴지통 항목을 원래 자리로 되돌려 옮긴다.
      description: 원래 경로에 이미 파일이 있거나 블록의 페이지가 없으면 409.
      responses:
        "200":
          description: 복원했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashRestore"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: 내장·설치된 view 템플릿.
      responses:
        "200":
          description: 템플릿 목록.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /templates/{name}/schema:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        example: resume
    get:
      tags: [templates]
      operationId: getTemplateSchema
      summary: 템플릿의 slot 스키마(schema.json).
      responses:
        "200":
          description: 스키마 문서.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSchema"
        "404":
          $ref: "#/components/responses/NotFound"

  /viewers:
    get:
      tags: [viewers]
      operationId: listViewers
      summary: 등록된 뷰어와 상태(끊김 포함).
      description: |
        등록부(`~/.madang/viewers.yaml`)의 항목은 정본 폴더를 가리키는
        참조다. 정본 폴더가 없거나 규격이 깨졌으면 `status`가 `broken`
        (끊김)이며, 그 뷰어를 쓰는 문서는 데이터를 표로 대신 보여 준다.
        `project`를 주면 그 프로젝트 `.madang/viewers/`의 뷰어가 먼저 온다
        (같은 이름이면 그 프로젝트 안에서 우선).
      parameters:
        - name: project
          in: query
          required: false
          description: 프로젝트 전용 뷰어도 넣을 프로젝트 id.
          schema:
            type: string
          example: jobs
      responses:
        "200":
          description: 뷰어 목록.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ViewerStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [viewers]
      operationId: registerViewer
      summary: 뷰어 폴더를 `viewer.json`의 이름으로 등록한다.
      description: |
        복사하지 않고 폴더를 참조한다. `pinned`면 지금 내용의 해시로
        `cache/`에 사본을 만든다. 규격이 틀리면 400, 같은 이름이 이미 있으면
        409. 등록하면 `viewer.changed`를 낸다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerRegister"
      responses:
        "201":
          description: 등록한 뷰어.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "409":
          $ref: "#/components/responses/Conflict"

  /events:
    x-websocket:
      protocol: websocket
      direction: server-to-client
      message: "#/components/schemas/Event"
    get:
      tags: [events]
      operationId: openEvents
      summary: 변경 이벤트 WebSocket 스트림.
      description: |
        WebSocket으로 업그레이드한다. 텍스트 프레임 하나가 JSON `Event`
        하나다(`components.schemas.Event` 참고, `type`으로 구분). 클라이언트는
        아무것도 보내지 않는다. 재연결 후 클라이언트는 프로젝트, 페이지, 열려 있는
        페이지를 다시 가져온다.
      x-websocket: true
      responses:
        "101":
          description: WebSocket 프로토콜로 전환한다.

components:
  parameters:
    Project:
      name: project
      in: path
      required: true
      description: 프로젝트 id.
      schema:
        type: string
      example: jobs
    Page:
      name: page
      in: path
      required: true
      description: 페이지 id.
      schema:
        type: string
      example: 2026-09-24-resume
    Block:
      name: block
      in: path
      required: true
      description: 블록 id.
      schema:
        type: string
      example: b04
    RunNumber:
      name: n
      in: path
      required: true
      description: 페이지 안의 run 번호.
      schema:
        type: integer
        minimum: 1
      example: 2

    RunName:
      name: name
      in: path
      required: true
      description: "`runs:`에 선언한 실행 대상 이름(URL 인코딩)."
      schema:
        type: string
      example: 이력서 사이트
    PageQuery:
      name: page
      in: query
      required: false
      description: 이 페이지의 워크트리(있으면)에서 일한다. 없으면 프로젝트 폴더.
      schema:
        type: string
      example: 2026-09-24-lock

  responses:
    Invalid:
      description: 요청 또는 결과 파일이 검사에 실패했다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationFailure"
    NotFound:
      description: 프로젝트, 페이지, 블록, run, 파일이 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: not_found
            message: page '2026-09-30-missing' not found
    Conflict:
      description: 현재 상태에서는 변경할 수 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: conflict
            message: "project 'jobs' still has child projects: jobs-2025"

  schemas:
    # 오류

    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: >-
            기계가 읽는 사유: `not_found`, `conflict`, `invalid`, `busy`,
            `no_repo`, `denied`(정책의 금지 명령), 게시 오류 코드
            (`target-missing`, `nothing-to-undo`, `target-changed` 등).
        message:
          type: string
      examples:
        - error: conflict
          message: a run is already in progress on this page
        - error: denied
          message: "금지 명령: push --force"

    Issue:
      type: object
      description: 검사 문제 하나.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            케밥 표기 식별자. 알려진 코드: `missing-file`,
            `unreadable`, `frontmatter`, `missing-key`, `invalid-value`,
            `duplicate-decision`, `choice-not-in-options`, `repo-unset`,
            `invalid-artifact`, `artifact-missing`, `missing-section`,
            `token-limit`, `done-without-verify`, `invalid-yaml`.
        message:
          type: string
        line:
          type: [integer, "null"]
          description: 1부터 세는 파일 줄. 알 때만.
        path:
          type: [string, "null"]
          description: 파일. 알 때만.
      examples:
        - code: missing-section
          message: "missing required section '## 다음 할 일'"
          line: null
          path: ledger.md

    ValidationFailure:
      type: object
      required: [error, message, issues]
      properties:
        error:
          type: string
          enum: [invalid]
        message:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
      examples:
        - error: invalid
          message: ledger.md failed validation
          issues:
            - code: invalid-value
              message: "status: expected planning | doing | blocked | review | done"
              line: 2
              path: ledger.md
            - code: token-limit
              message: ledger.md is 2310 tokens (limit 2000); summarize the log
              line: null
              path: ledger.md

    # 시스템

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: core 버전.
      examples:
        - status: ok
          version: 0.1.0

    # 설정

    HomeStatus:
      type: object
      description: core가 쓰는 앱 홈(전역 설정 폴더, git 저장소 아님).
      required: [path, initialized]
      properties:
        path:
          type: string
          description: 앱 홈의 절대 경로.
        initialized:
          type: boolean
          description: |
            지금 구조의 설정 파일이 있는 앱 홈인지. 거짓이면 온보딩이 필요하다.
            예전 구조(`spaces/`가 있는 앱 홈)도 거짓이다.
      examples:
        - path: /Users/me/.madang
          initialized: true
        - path: /Users/me/.madang
          initialized: false

    HomeInit:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 앱 홈 경로. `~`는 사용자 홈으로 푼다.
      examples:
        - path: ~/.madang
        - path: ~/Documents/madang

    RoutesDocument:
      type: object
      description: config.yaml의 routes 절 원문.
      required: [text]
      properties:
        text:
          type: string
      examples:
        - text: |
            kinds: [design, build, small, review, explore]
            default_kind: build
            tiers:
              design: [{runner: claude, model: claude-opus-5-5, effort: high}]
              build: [{runner: codex, model: gpt-6-sol, effort: medium}]
              small: [{runner: codex, model: gpt-6-luna, effort: high}]
              review: [{runner: opposite, model: primary}]
              explore: [{runner: codex, model: gpt-6-luna, effort: medium}]

    # 러너

    RunnerStatus:
      type: object
      required: [name, available]
      properties:
        name:
          type: string
          description: config.yaml runners 절의 runner 이름.
        available:
          type: boolean
        auth:
          type: string
          enum: [subscription, api]
        reason:
          type: [string, "null"]
          description: runner를 쓸 수 없는 이유.
      examples:
        - name: codex
          available: false
          auth: subscription
          reason: not logged in

    RunnerAvailability:
      type: object
      required: [checked, runners]
      properties:
        checked:
          type: string
          format: date-time
        runners:
          type: array
          items:
            $ref: "#/components/schemas/RunnerStatus"
      examples:
        - checked: "2026-09-24T09:30:12+09:00"
          runners:
            - name: claude
              available: true
              auth: subscription
              reason: null
            - name: codex
              available: true
              auth: subscription
              reason: null

    # 프로젝트

    ProjectSort:
      type: string
      description: 고정된 페이지 다음에 프로젝트의 페이지를 어떤 기준으로 정렬할지.
      enum: [updated, created, title]

    Project:
      type: object
      description: |
        페이지 기록을 `<path>/.madang/`에 담는 로컬 폴더(보통 git 저장소).
        제목과 표시 설정은 앱 홈 `config.yaml`의 `projects`에 있다.
      required: [id, title, path]
      properties:
        id:
          type: string
          description: 프로젝트 id(슬러그).
        title:
          type: string
          description: 제목. 따로 정하지 않으면 폴더 이름.
        path:
          type: string
          description: 프로젝트 폴더의 절대 경로.
        parent:
          type: [string, "null"]
          description: 상위 프로젝트 id. 최상위 프로젝트면 null.
        icon:
          type: [string, "null"]
          description: 프로젝트 옆에 보여 줄 아이콘 이름.
        color:
          type: [string, "null"]
          description: 강조 색(`#rrggbb`).
          pattern: "^#[0-9a-fA-F]{6}$"
        sort:
          $ref: "#/components/schemas/ProjectSort"
        pages:
          type: integer
          description: 페이지 수.
        active_pages:
          type: integer
          description: 상태가 doing 또는 blocked인 페이지 수.
      examples:
        - id: jobs
          title: 지원
          path: /Users/me/Documents/jobs
          parent: null
          icon: briefcase
          color: "#3a5bd9"
          sort: updated
          pages: 2
          active_pages: 0
        - id: madang
          title: madang
          path: /Users/me/src/madang
          parent: null
          icon: null
          color: null
          sort: created
          pages: 0
          active_pages: 0

    ProjectCreate:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 등록할 폴더. 있어야 한다. `~`는 사용자 홈으로 푼다.
        id:
          type: string
          description: 프로젝트 id. 생략하면 폴더 이름의 슬러그.
        title:
          type: string
          description: 제목. 생략하면 폴더 이름.
        parent:
          type: string
          description: 상위 프로젝트 id.
        icon:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        sort:
          $ref: "#/components/schemas/ProjectSort"
      examples:
        - path: ~/src/madang
        - path: ~/Documents/jobs
          id: jobs
          title: 지원
          icon: briefcase
          color: "#3a5bd9"
          sort: created

    ProjectUpdate:
      type: object
      properties:
        title:
          type: string
        parent:
          type: [string, "null"]
          description: id를 주면 그 프로젝트 아래로 옮기고 null이면 최상위로 옮긴다.
        icon:
          type: [string, "null"]
        color:
          type: [string, "null"]
          pattern: "^#[0-9a-fA-F]{6}$"
        sort:
          $ref: "#/components/schemas/ProjectSort"
      examples:
        - title: 지원 2026
        - parent: jobs
          icon: folder
          color: "#3a5bd9"
          sort: title

    # 페이지

    PageStatus:
      type: string
      enum: [planning, doing, blocked, review, done]

    RunRef:
      type: object
      description: 카드에 보여 줄 페이지의 마지막 run.
      required: [n, runner, model]
      properties:
        n:
          type: integer
        runner:
          type: string
        model:
          type: string
        result_status:
          $ref: "#/components/schemas/RunResultStatus"
      examples:
        - n: 2
          runner: codex
          model: gpt-6-luna
          result_status: review

    PageCard:
      type: object
      description: 페이지 목록의 카드 하나.
      required: [id, project, title, status, pinned, tags, block_counts]
      properties:
        id:
          type: string
        project:
          type: string
          description: 페이지가 속한 프로젝트 id.
        title:
          type: string
        kind:
          type: string
          description: 기본 요청 종류(router 힌트).
        status:
          $ref: "#/components/schemas/PageStatus"
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        pinned:
          type: boolean
        tags:
          type: array
          items:
            type: string
        preview:
          type: [string, "null"]
          description: 마지막 메시지 한 줄.
        block_counts:
          type: object
          description: 블록 종류별 개수. run은 `run`으로 센다.
          additionalProperties:
            type: integer
        last_run:
          $ref: "#/components/schemas/RunRef"
          description: 페이지에 run이 아직 없으면 없다.
        first_view:
          type: [string, "null"]
          description: 카드 썸네일용 첫 view 블록의 id.
      examples:
        - id: 2026-09-24-resume
          project: jobs
          title: 이력서
          kind: build
          status: review
          created: "2026-09-24T08:10:00+09:00"
          updated: "2026-09-24T09:31:41+09:00"
          pinned: true
          tags: [이력서]
          preview: work 순서를 바꿨습니다. 펄어비스 경력이 맨 위입니다.
          block_counts: {message: 9, view: 1, data: 2, run: 2}
          last_run: {n: 2, runner: codex, model: gpt-6-luna, result_status: review}
          first_view: b04

    PageCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        kind:
          type: string
          description: 기본값은 config.yaml routes 절의 `default_kind`.
      examples:
        - title: 이력서
          kind: build

    PageUpdate:
      type: object
      properties:
        title:
          type: string
        pinned:
          type: boolean
        tags:
          type: array
          items:
            type: string
        blocks_order:
          type: array
          description: page.md `blocks`의 새 순서 전체.
          items:
            type: string
        project:
          type: string
          description: 페이지 폴더를 옮길 프로젝트 id(그 프로젝트의 `.madang/pages/`로 옮긴다).
      examples:
        - pinned: true
          tags: [이력서]
        - project: archive

    PageDetail:
      type: object
      description: page.md, 본문 순서대로의 블록 머리부, run 목록.
      required: [id, project, title, status, pinned, tags, blocks, runs, unknown_files]
      properties:
        id:
          type: string
        project:
          type: string
          description: 페이지가 속한 프로젝트 id.
        title:
          type: string
        kind:
          type: string
        status:
          $ref: "#/components/schemas/PageStatus"
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        pinned:
          type: boolean
        tags:
          type: array
          items:
            type: string
        overview:
          type: string
          description: page.md의 Markdown 본문.
        blocks:
          type: array
          description: page.md `blocks` 순서의 블록 머리부.
          items:
            $ref: "#/components/schemas/BlockHeader"
        runs:
          type: array
          description: >-
            run 요약, 오름차순. 각 run은 `trigger.message`의 메시지 뒤에
            보여 준다.
          items:
            $ref: "#/components/schemas/RunRecord"
        unknown_files:
          type: array
          description: 미처리 알 수 없는 파일. 비어 있지 않으면 배너를 보여 준다.
          items:
            $ref: "#/components/schemas/UnknownFile"
        waiting:
          $ref: "#/components/schemas/FlowWaitingData"
          description: >-
            flow가 사람 결정이나 runner를 기다리는 동안에만 있다.
        busy:
          type: boolean
          default: false
          description: >-
            이 페이지에서 흐름(요청 처리)이 진행 중이면 참. 진행 중에는 새
            메시지와 답을 409 busy로 거부한다. 흐름이 끝나거나 사람의 답을
            기다리며 멈추면 거짓이다.
      examples:
        - id: 2026-09-24-resume
          project: jobs
          title: 이력서
          kind: build
          status: review
          created: "2026-09-24T08:10:00+09:00"
          updated: "2026-09-24T09:31:41+09:00"
          pinned: true
          tags: [이력서]
          overview: ""
          blocks:
            - {id: b01, type: message, role: user, ts: "2026-09-24T08:11:02+09:00", text: 이력서 템플릿 만들어줘, target: {}}
            - {id: b02, type: message, role: router, ts: "2026-09-24T08:11:03+09:00", run: 1, text: "kind=design conf=0.91 → claude/claude-opus-5-5 high"}
            - {id: b03, type: message, role: agent, ts: "2026-09-24T08:14:40+09:00", run: 1, text: "이력서 뷰(b04)와 기본 데이터(b05), 펄어비스용 덮어쓰기(b06)를 만들었습니다."}
            - id: b04
              type: view
              file: blocks/b04-resume.view.md
              title: 이력서
              created_by: run 1
              template: resume@1
              bindings: {base: b05, overlay: b06}
              presets:
                기본: {base: b05}
                펄어비스: {base: b05, overlay: b06}
              active_preset: 펄어비스
              theme: {color.accent: "#3a5bd9"}
            - {id: b05, type: data, file: blocks/b05-base.json, title: 기본 데이터, created_by: run 1, format: json}
            - {id: b06, type: data, file: blocks/b06-pearlabyss.json, title: 펄어비스 덮어쓰기, created_by: run 1, format: json}
            - {id: b07, type: message, role: user, ts: "2026-09-24T09:30:58+09:00", text: 펄어비스 경력을 맨 위로, target: {block: b04, elements: ["work[1]"], mode: edit}}
            - {id: b08, type: message, role: router, ts: "2026-09-24T09:31:00+09:00", run: 2, text: "kind=small conf=1.00 → codex/gpt-6-luna high"}
            - {id: b09, type: message, role: agent, ts: "2026-09-24T09:31:41+09:00", run: 2, text: work 순서를 바꿨습니다. 펄어비스 경력이 맨 위입니다.}
          runs:
            - n: 1
              started: "2026-09-24T08:11:03+09:00"
              finished: "2026-09-24T08:14:40+09:00"
              trigger: {message: b01}
              kind: design
              tier: 1
              runner: claude
              model: claude-opus-5-5
              effort: high
              input:
                parts: {system_est: 24600, profile: 110, brief: 1840, ledger: 380, contract: 420, target: 0, request: 12}
                total_est: 27362
              usage: {input: 27410, cached: 0, output: 3120}
              changed_files: [blocks/b04-resume.view.md, blocks/b05-base.json, blocks/b06-pearlabyss.json, ledger.md]
              unknown_files: []
              verify: {cmd: null, ok: null}
              result_status: review
              events_log: runs/1.jsonl
            - n: 2
              started: "2026-09-24T09:31:00+09:00"
              finished: "2026-09-24T09:31:41+09:00"
              trigger: {message: b07, target: b04, elements: ["work[1]"], mode: edit}
              kind: small
              tier: 1
              runner: codex
              model: gpt-6-luna
              effort: high
              input:
                parts: {system_est: 24600, profile: 110, brief: 1840, ledger: 1320, contract: 420, target: 900, request: 40}
                total_est: 29230
              usage: {input: 29104, cached: 24310, output: 612}
              changed_files: [blocks/b05-base.json]
