    BlockAddedEvent:
      type: object
      required: [type, ts, space, page, block, data]
      properties:
        type: {type: string, enum: [block.added]}
        ts: {type: string, format: date-time}
        space: {type: string}
        page: {type: string}
        block: {type: string}
        run: {type: integer}
        data: {$ref: "#/components/schemas/BlockEventData"}
      examples:
        - type: block.added
          ts: "2026-09-24T09:31:41+09:00"
