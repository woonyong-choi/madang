              block_counts: {message: 9, view: 1, data: 2, run: 2}
              last_run: {n: 2, runner: codex, model: gpt-6-luna, result_status: review}
              first_view: b04

    PageDeletedEvent:
      type: object
      required: [type, ts, space, page, data]
      properties:
        type: {type: string, enum: [page.deleted]}
        ts: {type: string, format: date-time}
        space: {type: string}
        page: {type: string}
        data: {$ref: "#/components/schemas/DeletedRef"}
      examples:
        - type: page.deleted
          ts: "2026-09-23T18:02:11+09:00"
