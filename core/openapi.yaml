        content:
          type: string
        format:
          type: string
          enum: [json, csv]
          description: 데이터 형식. 기본값 json.
        template:
          type: string
          description: "`name` 또는 `name@version`."
        bindings:
          type: object
          additionalProperties:
            type: string
      examples:
