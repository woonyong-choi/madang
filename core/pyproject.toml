[project]
name = "madang"
version = "0.1.0"
description = "Madang core: flow engine, runners, validators, app home storage, and the madang CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "typer>=0.12",
]

[project.scripts]
madang = "madang.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["madang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: runs the real claude and codex CLIs (deselected by default; use -m integration)",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "B",
    "SIM",
    "PLC",
    "PLE",
    "PLW",
]
ignore = [
    "D105",  # Magic methods are self-describing.
    "D107",  # __init__ arguments are documented on the class.
    "PLC0415",  # Lazy imports keep CLI startup light.
    "PLW2901",  # Loop variable rebinding is idiomatic for normalisation.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["madang"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
