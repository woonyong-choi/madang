[project]
name = "madang"
version = "0.1.0"
description = "Madang core: flow engine, runners, validators, project record storage, and the madang CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "psutil>=7.2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "typer>=0.12",
    "uvicorn>=0.53",
    "websockets>=16",
]

[project.scripts]
madang = "madang.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "openapi-spec-validator>=0.9",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["madang"]

# API 계약은 패키지 안에서도 읽을 수 있어야 한다(madang openapi, /openapi.json).
[tool.hatch.build.targets.wheel.force-include]
"openapi.yaml" = "madang/openapi.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: runs the real claude and codex CLIs (deselected by default; use -m integration)",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "B",
    "SIM",
    "PLC",
    "PLE",
    "PLW",
]
ignore = [
    "D105",  # 매직 메서드는 이름만으로 뜻이 드러난다.
    "D107",  # __init__ 인자는 클래스 docstring에 적는다.
    "PLC0415",  # 지연 import로 CLI 시작을 가볍게 한다.
    "PLW2901",  # 정규화 시 루프 변수 재할당은 관용적이다.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["madang"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
