[project]
name = "madang"
version = "0.1.0"
description = "Madang core: flow engine, runners, validators, app home storage, and the madang CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "typer>=0.12",
]

[project.scripts]
madang = "madang.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["madang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
